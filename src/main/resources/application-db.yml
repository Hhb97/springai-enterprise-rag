# ============================================================
# 数据源 & JPA & Hibernate
# ============================================================

spring:
  datasource:
    url: jdbc:h2:file:./data/ragdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Spring Boot 4.x + Hibernate 7.2 不再自动猜测方言，必须显式指定 H2
        dialect: org.hibernate.dialect.H2Dialect
        # 关闭 Hibernate 7 对 enum/ddl-auto 的严格检查（避免老 DB 表元数据缺失时报错）
        schema_management:
          tool:
            uniqueConstraintStrategy: skip
