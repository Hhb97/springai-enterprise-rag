# ============================================================
# Spring AI：LLM 后端（Ollama / DashScope）、Embedding
# ============================================================

spring:
  ai:
    # ===== LLM 后端选择：ollama（本地）/ dashscope（阿里云百炼）=====
    # chat-backend: 控制 ChatClient 和 Agent Tool Calling 用哪个模型
    # embedding-backend: 控制向量编码用哪个模型（建议本地 Ollama 保持 nomic-embed-text，成本低）
    chat-backend: ${CHAT_BACKEND:ollama}
    embedding-backend: ${EMBED_BACKEND:ollama}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://192.168.221.130:11434}
      # Spring AI 2.0 GA 聊天模型（AutoConfiguration 正确识别的前缀）
      default-chat-options:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:1.5b}
        temperature: 0.3
        num-predict: 1024
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:1.5b}
          temperature: 0.3
          num-predict: 1024
      # Spring AI 2.0 GA embedding 模型（两种写法都留，覆盖不同 BOM 版本的属性绑定）
      # 错误：mxbai-embed-large 是默认值，很多 Ollama 没 pull，必须显式指定 nomic-embed-text
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:bge-m3}
      default-embedding-options:
        model: ${OLLAMA_EMBED_MODEL:bge-m3}

    # ===== 阿里云百炼 DashScope（OpenAI 兼容协议）=====
    # 控制台：https://bailian.console.aliyun.com/
    # 创建 API Key 后填入，或通过环境变量 DASHSCOPE_API_KEY 注入
    # 安全提醒：不要在 yml 里写死真实 Key，优先用环境变量 .env 注入
    openai:
      api-key: ${DASHSCOPE_API_KEY:API_KEY}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # DashScope 聊天模型（任选其一）：
      #   qwen3.7-plus       通义千问 3.7 Plus（性价比高，推荐）
      #   qwen3.7-flash      通义千问 3.7 Flash（速度快，免费额度大）
      #   qwen-plus          通义千问 Plus（稳定版）
      #   qwen-max           通义千问 Max（效果最好）
      #   qwen-turbo         通义千问 Turbo（响应最快）
      #   qwen-vl-plus       多模态
      default-chat-options:
        model: ${DASHSCOPE_CHAT_MODEL:qwen3.7-plus}
        temperature: 0.3
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen3.7-plus}
          temperature: 0.3
      # ===== DashScope Embedding 向量编码 =====
      # 当 EMBED_BACKEND=dashscope 时使用（不用本地装 Ollama）
#       # 计费：按量，官方文档查看价格
#       embedding:
#         options:
#           model: text-embedding-v3