  url: http://192.168.221.130:8086
  username: influxdb
  password: 123456
  database: acucloud-dev
  retention-policy: autogen
  timeout-seconds: 30

# === Prompt 工程化配置（可热修改，无需改代码） ===
# 注：原 prompt.agent.max-history 已移除 —— PromptBuilder 注入了它却从未使用，
# 真正控制历史轮数的是上面的 agent.memory-size。
prompt:
  agent:
    role: 你是智能运维助手，支持设备查询、能耗分析与知识库问答
  rag:
    role: 你是专业的后端管理平台 AI 助手