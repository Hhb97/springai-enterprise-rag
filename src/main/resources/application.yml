server:
  port: 8900

spring:
  application:
    name: rag-assistant

  datasource:
    url: jdbc:h2:file:./data/ragdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Spring Boot 4.x + Hibernate 7.2 不再自动猜测方言，必须显式指定 H2
        dialect: org.hibernate.dialect.H2Dialect
        # 关闭 Hibernate 7 对 enum/ddl-auto 的严格检查（避免老 DB 表元数据缺失时报错）
        schema_management:
          tool:
            uniqueConstraintStrategy: skip

  ai:
    ollama:
      base-url: http://192.168.221.130:11434
      # Spring AI 2.0 GA 聊天模型（AutoConfiguration 正确识别的前缀）
      default-chat-options:
        model: qwen2.5:1.5b
        temperature: 0.3
        num-predict: 1024
      chat:
        options:
          model: qwen2.5:1.5b
          temperature: 0.3
          num-predict: 1024
      # Spring AI 2.0 GA embedding 模型（两种写法都留，覆盖不同 BOM 版本的属性绑定）
      # 错误：mxbai-embed-large 是默认值，很多 Ollama 没 pull，必须显式指定 nomic-embed-text
      embedding:
        options:
          model: nomic-embed-text
      default-embedding-options:
        model: nomic-embed-text

# RAG 配置
rag:
  top-k: 3
  hybrid-search:
    keyword-weight: 0.3
    vector-weight: 0.7

# Spring AI 2.0 Agent 相关配置（预留）
agent:
  default-max-iterations: 5
  default-memory-size: 20

# Spring Boot 4.x Actuator + Spring AI 2.0 Observation（生产可开）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  observations:
    spring-ai:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 文件存储配置
storage:
  upload-dir: ./uploads

# InfluxDB 1.x 配置
influxdb:
  url: http://192.168.221.130:8086
  username: influxdb
  password: 123456
  database: acucloud-dev
  retention-policy: autogen
  timeout-seconds: 30

# === Prompt 工程化配置（可热修改，无需改代码） ===
prompt:
  agent:
    role: 你是智能运维助手，支持设备查询、能耗分析与知识库问答
    max-history: 20
  rag:
    role: 你是专业的后端管理平台 AI 助手