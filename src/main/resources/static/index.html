<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 运维助手</title>
    <style>
        /* ================================================================
   *  AI 运维助手 · 现代化 UI 设计系统 v2
   *  参考：Kimi 2025 · ChatGPT o3 Mini · Claude Sonnet 3.7 · DeepSeek R1
   *  核心特征：低饱和冷调 + 玻璃拟态 + 微点阵背景 + 分层阴影
   * ================================================================ */

        :root {
            /* ===== 主色：克制的靛蓝-紫渐变，高级耐看 ===== */
            --accent: #4f46e5;
            --accent-2: #7c3aed;
            --accent-3: #8b5cf6;
            --accent-hover: #4338ca;

            /* ===== 背景与表面 ===== */
            --sidebar-bg-solid: #f5f6fa;
            --sidebar-bg: rgba(245, 246, 250, 0.80);
            --main-bg: #fbfbfe;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --chat-bg-dot-1: rgba(99, 102, 241, 0.06);
            --chat-bg-dot-2: rgba(16, 185, 129, 0.04);

            /* ===== 气泡 ===== */
            --bubble-user-bg: linear-gradient(135deg, #6366f1 0%, #7c3aed 60%, #9333ea 100%);
            --bubble-bot-bg: rgba(255, 255, 255, 0.92);
            --bubble-bot-border: rgba(148, 163, 184, 0.18);

            /* ===== 文本 ===== */
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --text-soft: #475569;

            /* ===== 边框 & 通用 ===== */
            --border: rgba(148, 163, 184, 0.18);
            --border-strong: rgba(148, 163, 184, 0.32);
            --sidebar-border: rgba(148, 163, 184, 0.15);
            --sidebar-item-hover: rgba(99, 102, 241, 0.08);
            --sidebar-item-active: linear-gradient(135deg, rgba(99, 102, 241, 0.14), rgba(139, 92, 246, 0.10));
            --accent-glow: 0 0 0 4px rgba(99, 102, 241, 0.12);

            --danger: #ef4444;
            --success: #10b981;
            --warn: #f59e0b;

            /* ===== 阴影分层（现代感核心） ===== */
            --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 8px 28px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 16px 48px rgba(15, 23, 42, 0.10);
            --shadow-glow: 0 10px 32px rgba(99, 102, 241, 0.18);

            /* ===== 圆角：比原来大一圈 ===== */
            --radius-xs: 8px;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 28px;
        }

        /* ===== 深色主题 ===== */
        [data-theme="dark"] {
            --sidebar-bg-solid: #0e1020;
            --sidebar-bg: rgba(14, 16, 32, 0.78);
            --main-bg: #07091a;
            --surface: #11142a;
            --surface-2: #141832;
            --chat-bg-dot-1: rgba(139, 92, 246, 0.10);
            --chat-bg-dot-2: rgba(16, 185, 129, 0.05);
            --bubble-bot-bg: rgba(20, 24, 50, 0.86);
            --bubble-bot-border: rgba(99, 102, 241, 0.25);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-soft: #cbd5e1;
            --border: rgba(99, 102, 241, 0.20);
            --border-strong: rgba(148, 163, 184, 0.35);
            --sidebar-border: rgba(99, 102, 241, 0.18);
            --sidebar-item-hover: rgba(99, 102, 241, 0.14);
            --sidebar-item-active: linear-gradient(135deg, rgba(99, 102, 241, 0.26), rgba(139, 92, 246, 0.20));
            --accent-glow: 0 0 0 4px rgba(139, 92, 246, 0.22);

            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.5);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.55);
            --shadow-md: 0 10px 32px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 20px 56px rgba(0, 0, 0, 0.65);
            --shadow-glow: 0 10px 32px rgba(139, 92, 246, 0.35);
        }

        /* ===== 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== 全局动画 ===== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-16px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", Roboto, sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            text-rendering: optimizeLegibility;
            letter-spacing: 0.01em;
        }

        body {
            /* 点阵 + 柔和径向渐变背景（2025 最新 AI 聊天标配） */
            background-color: var(--main-bg);
            background-image: radial-gradient(circle at 12% 0%, var(--chat-bg-dot-1) 0, transparent 45%),
            radial-gradient(circle at 92% 15%, var(--chat-bg-dot-2) 0, transparent 45%),
            radial-gradient(circle at 0 100%, rgba(59, 130, 246, 0.05) 0, transparent 40%),
            radial-gradient(#cbd5e122 1px, transparent 1px),
            radial-gradient(#cbd5e122 1px, transparent 1px);
            background-size: auto, auto, auto, 22px 22px, 22px 22px;
            background-position: 0 0, 0 0, 0 0, 0 0, 11px 11px;
            background-attachment: fixed;
        }

        [data-theme="dark"] body {
            background-image: radial-gradient(circle at 12% 0%, var(--chat-bg-dot-1) 0, transparent 45%),
            radial-gradient(circle at 92% 15%, var(--chat-bg-dot-2) 0, transparent 45%),
            radial-gradient(circle at 0 100%, rgba(59, 130, 246, 0.08) 0, transparent 40%),
            radial-gradient(#33415540 1px, transparent 1px),
            radial-gradient(#33415540 1px, transparent 1px);
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* 全局滚动条：极细 + 悬浮显示 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 3px;
            transition: background .2s;
        }

        *:hover::-webkit-scrollbar-thumb {
            background: var(--border-strong);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ================= 侧栏：玻璃拟态 ================= */
        .sidebar {
            width: 272px;
            min-width: 272px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            display: flex;
            flex-direction: column;
            transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            z-index: 100;
            animation: slideInLeft 0.4s ease-out;
        }

        .sidebar.collapsed {
            width: 0;
            min-width: 0;
            border: none;
            opacity: 0;
        }

        .sidebar-header {
            padding: 18px 16px 14px;
            display: flex;
            align-items: center;
            gap: 11px;
            border-bottom: 1px solid var(--sidebar-border);
            animation: fadeInDown 0.5s ease-out 0.1s backwards;
        }

        .sidebar-logo {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 19px;
            flex-shrink: 0;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.28);
            position: relative;
        }

        .sidebar-logo::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 13px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), transparent 60%);
            opacity: 0.5;
            z-index: -1;
        }

        .sidebar-title {
            font-size: 15.5px;
            font-weight: 700;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-subtitle {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-top: 3px;
            letter-spacing: 0.02em;
        }

        /* 新建会话按钮：主风格渐变描边 + 悬浮上浮 */
        .new-chat-btn {
            margin: 14px 12px;
            padding: 11px 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.20s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out 0.15s backwards;
        }

        .new-chat-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), transparent 60%);
            opacity: 0;
            transition: opacity .2s;
        }

        .new-chat-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .new-chat-btn:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm), var(--accent-glow);
            color: var(--accent);
        }

        .new-chat-btn:hover::before {
            opacity: 1;
        }

        .new-chat-btn:active::after {
            width: 200px;
            height: 200px;
        }

        .new-chat-btn svg {
            width: 16px;
            height: 16px;
            position: relative;
            z-index: 1;
            transition: transform 0.2s;
        }

        .new-chat-btn:hover svg {
            transform: rotate(90deg);
        }

        .new-chat-btn > span {
            position: relative;
            z-index: 1;
        }

        .sidebar-nav {
            padding: 0 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 8px;
        }

        .sidebar-nav a {
            padding: 9px 12px;
            border-radius: var(--radius-xs);
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 9px;
            transition: all 0.14s;
            animation: slideInLeft 0.4s ease-out backwards;
        }

        .sidebar-nav a:nth-child(1) { animation-delay: 0.2s; }
        .sidebar-nav a:nth-child(2) { animation-delay: 0.25s; }

        .sidebar-nav a:hover {
            background: var(--sidebar-item-hover);
            color: var(--text-primary);
            transform: translateX(3px);
        }

        .sidebar-nav a:hover svg {
            transform: scale(1.1);
        }

        .sidebar-nav a svg {
            transition: transform 0.2s;
        }

        .sidebar-nav a svg {
            width: 14.5px;
            height: 14.5px;
            opacity: 0.9;
        }

        .chat-list-label {
            padding: 14px 18px 6px;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.4s ease-out 0.3s backwards;
        }

        .chat-list-label .clear-all {
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 5px;
            transition: all .15s;
        }

        .chat-list-label .clear-all:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 18px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            position: relative;
            transition: all 0.14s;
            border: 1px solid transparent;
            animation: slideInLeft 0.35s ease-out backwards;
        }

        .chat-item:nth-child(1) { animation-delay: 0.32s; }
        .chat-item:nth-child(2) { animation-delay: 0.34s; }
        .chat-item:nth-child(3) { animation-delay: 0.36s; }
        .chat-item:nth-child(4) { animation-delay: 0.38s; }
        .chat-item:nth-child(5) { animation-delay: 0.40s; }

        .chat-item:hover {
            background: var(--sidebar-item-hover);
            border-color: var(--border);
        }

        .chat-item.active {
            background: var(--sidebar-item-active);
            color: var(--accent);
            border-color: rgba(99, 102, 241, 0.25);
            box-shadow: var(--shadow-xs);
        }

        .chat-item-title {
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 26px;
            line-height: 1.45;
        }

        .chat-item-time {
            font-size: 10.5px;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.02em;
        }

        .chat-item.active .chat-item-time {
            color: var(--accent-3);
            opacity: 0.8;
        }

        .chat-item-delete {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.14s;
        }

        .chat-item:hover .chat-item-delete {
            opacity: 1;
        }

        .chat-item-delete:hover {
            background: rgba(239, 68, 68, 0.12);
            color: var(--danger);
        }

        .chat-item-delete svg {
            width: 13px;
            height: 13px;
        }

        .sidebar-footer {
            padding: 13px 14px;
            border-top: 1px solid var(--sidebar-border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(180deg, transparent, rgba(99, 102, 241, 0.04));
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            }
            50% {
                opacity: 0.5;
                box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.1);
            }
        }

        .status-text {
            font-size: 12px;
            color: var(--text-secondary);
            flex: 1;
            font-weight: 500;
        }

        .theme-toggle {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.14s;
        }

        .theme-toggle:hover {
            background: var(--sidebar-item-hover);
            color: var(--accent);
            transform: rotate(12deg);
        }

        .theme-toggle svg {
            width: 16.5px;
            height: 16.5px;
        }

        /* ================= 主区 + 顶栏 ================= */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        .topbar {
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            gap: 16px;
            background: rgba(251, 251, 254, 0.75);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            position: relative;
            z-index: 10;
            animation: fadeInDown 0.5s ease-out;
        }

        [data-theme="dark"] .topbar {
            background: rgba(7, 9, 26, 0.75);
        }

        .sidebar-toggle {
            width: 38px;
            height: 38px;
            border: none;
            background: transparent;
            border-radius: 11px;
            cursor: pointer;
            color: var(--text-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
        }

        .sidebar-toggle:hover {
            background: var(--sidebar-item-hover);
            color: var(--accent);
        }

        .sidebar-toggle svg {
            width: 19px;
            height: 19px;
        }

        .topbar-title {
            font-size: 14.5px;
            font-weight: 700;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-soft);
            letter-spacing: 0.01em;
        }

        .topbar-title::before {
            content: '✨';
            margin-right: 7px;
            opacity: 0.9;
            filter: saturate(0.9);
        }

        /* ============== 用户信息 & 退出按钮 ============== */
        .user-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 8px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }
        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-soft);
        }
        .logout-btn {
            padding: 7px 12px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 12.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.18s;
        }
        .logout-btn:hover {
            background: #fef2f2;
            color: #dc2626;
            border-color: #fecaca;
        }
        [data-theme="dark"] .logout-btn:hover {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* ================= Segmented Control（ChatGPT 4.5 风格） ================= */
        .mode-group {
            display: inline-flex;
            align-items: center;
            padding: 4px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 13px;
            font-size: 12.5px;
            box-shadow: var(--shadow-xs);
            position: relative;
            animation: scaleIn 0.4s ease-out 0.2s backwards;
        }

        .mode-btn {
            padding: 6.5px 14px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 600;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
            position: relative;
            z-index: 2;
            white-space: nowrap;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .mode-btn:hover::before {
            opacity: 1;
        }

        .mode-btn:hover {
            color: var(--text-primary);
        }

        .mode-btn:active {
            transform: scale(0.96);
        }

        .mode-btn.active {
            background: var(--surface);
            color: var(--accent);
            box-shadow: var(--shadow-sm), 0 0 0 1px var(--border);
        }

        .mode-btn.active svg,
        .mode-btn:hover svg {
            transform: scale(1.06);
        }

        .mode-btn svg {
            width: 13.5px;
            height: 13.5px;
            transition: transform .2s;
        }

        .search-options {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            animation: fadeIn 0.4s ease-out 0.25s backwards;
        }

        .search-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background .15s;
        }

        .search-options label:hover {
            background: var(--sidebar-item-hover);
            color: var(--text-soft);
        }

        .search-options input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--accent);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .search-options input[type="checkbox"]:hover {
            transform: scale(1.1);
        }

        .search-options select {
            padding: 5px 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 9px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-soft);
            outline: none;
            transition: all .18s;
            cursor: pointer;
        }

        .search-options select:hover {
            border-color: var(--border-strong);
        }

        .search-options select:focus {
            border-color: var(--accent);
            box-shadow: var(--accent-glow);
        }

        /* ================= 欢迎页 ================= */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            scroll-padding-bottom: 40px;
        }

        /* 流式更新时禁用平滑滚动，避免抖动 */
        .chat-container.stream-updating {
            scroll-behavior: auto;
        }

        .welcome {
            max-width: 840px;
            margin: 0 auto;
            padding: 80px 28px 44px;
            animation: fadeInUp 0.6s ease-out;
        }

        .welcome-logo {
            width: 66px;
            height: 66px;
            border-radius: 20px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 24px;
            box-shadow: 0 14px 40px rgba(99, 102, 241, 0.32);
            position: relative;
            animation: floatY 6s ease-in-out infinite, scaleIn 0.5s ease-out 0.1s backwards;
        }

        @keyframes floatY {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        .welcome-logo::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(139, 92, 246, 0.3));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.7;
            pointer-events: none;
        }

        .welcome-title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 55%, var(--accent-2) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInUp 0.6s ease-out 0.15s backwards;
        }

        [data-theme="dark"] .welcome-title {
            background: linear-gradient(135deg, #f8fafc 0%, #a5b4fc 55%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14.5px;
            margin-bottom: 52px;
            line-height: 1.8;
            animation: fadeInUp 0.6s ease-out 0.2s backwards;
        }

        /* 推荐卡：悬浮上浮 + 柔和阴影 */
        .suggest-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 40px;
        }

        @media (max-width: 720px) {
            .suggest-grid {
                grid-template-columns: 1fr;
            }
        }

        .suggest-card {
            padding: 18px 18px 17px;
            background: var(--bubble-bot-bg);
            border: 1px solid var(--bubble-bot-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.5s ease-out backwards;
        }

        .suggest-card:nth-child(1) { animation-delay: 0.25s; }
        .suggest-card:nth-child(2) { animation-delay: 0.3s; }
        .suggest-card:nth-child(3) { animation-delay: 0.35s; }
        .suggest-card:nth-child(4) { animation-delay: 0.4s; }

        .suggest-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.07), transparent 55%);
            opacity: 0;
            transition: opacity .22s;
            pointer-events: none;
        }

        .suggest-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: var(--shadow-md), var(--accent-glow);
        }

        .suggest-card:hover::before {
            opacity: 1;
        }

        .suggest-card-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(139, 92, 246, 0.08));
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 18px;
            position: relative;
            z-index: 1;
        }

        .suggest-card-title {
            font-size: 14.5px;
            font-weight: 700;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }

        .suggest-card-desc {
            font-size: 12.5px;
            color: var(--text-secondary);
            line-height: 1.7;
            position: relative;
            z-index: 1;
        }

        .quick-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.5s ease-out 0.45s backwards;
        }

        .quick-chip {
            padding: 8px 15px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.18s;
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        .quick-chip::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .quick-chip:hover::before {
            opacity: 1;
        }

        .quick-chip:hover {
            background: var(--sidebar-item-hover);
            color: var(--accent);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .quick-chip:active {
            transform: translateY(0) scale(0.98);
        }

        /* ================= 消息容器 ================= */
        .messages-wrapper {
            max-width: 880px;
            margin: 0 auto;
            padding: 32px 24px 18px;
            animation: fadeIn 0.4s ease-out;
        }

        .message-row {
            display: flex;
            gap: 14px;
            margin-bottom: 32px;
            animation: slideIn 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15.5px;
            font-weight: 700;
            transition: transform .22s;
        }

        .message-row:hover .avatar {
            transform: translateY(-1px) scale(1.03);
        }

        .avatar.bot {
            background: linear-gradient(135deg, #4f46e5, #7c3aed 60%, #8b5cf6);
            color: #fff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.28);
            position: relative;
        }

        .avatar.user {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            color: #475569;
            box-shadow: var(--shadow-xs);
        }

        [data-theme="dark"] .avatar.user {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #cbd5e1;
        }

        .message-body {
            flex: 1;
            min-width: 0;
            max-width: calc(100% - 62px);
        }

        .message-row.user .message-body {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* 气泡：用户 - 胶囊渐变；AI - 半透明白色卡 + 柔和阴影 */
        .bubble {
            padding: 15px 18px 16px;
            border-radius: var(--radius-md);
            font-size: 14.8px;
            line-height: 1.8;
            word-wrap: break-word;
            word-break: break-word;
        }

        .message-row.user .bubble {
            background: var(--bubble-user-bg);
            color: #fff;
            border-top-right-radius: 5px;
            box-shadow: 0 6px 22px rgba(99, 102, 241, 0.30);
            backdrop-filter: blur(8px);
        }

        .message-row.bot .bubble {
            background: var(--bubble-bot-bg);
            color: var(--text-primary);
            border: 1px solid var(--bubble-bot-border);
            border-top-left-radius: 5px;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .message-tools {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s, transform .2s;
            transform: translateY(-2px);
        }

        .message-row:hover .message-tools {
            opacity: 1;
            transform: translateY(0);
        }

        .tool-btn {
            padding: 5px 10px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 11.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }

        .tool-btn:hover {
            background: var(--sidebar-item-hover);
            color: var(--accent);
        }

        .tool-btn.copied {
            color: var(--success);
        }

        .tool-btn svg {
            width: 13.5px;
            height: 13.5px;
        }

        /* ================= Markdown 美化 ================= */
        .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
            margin: 16px 0 10px;
            line-height: 1.4;
            font-weight: 750;
            letter-spacing: -0.005em;
            color: var(--text-primary);
        }

        .bubble h1 {
            font-size: 19.5px;
        }

        .bubble h2 {
            font-size: 17.5px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .bubble h3 {
            font-size: 16px;
        }

        .bubble h4 {
            font-size: 15px;
            color: var(--text-soft);
        }

        .bubble p {
            margin: 8px 0;
        }

        .bubble strong {
            font-weight: 700;
            color: var(--text-primary);
        }

        .bubble ul, .bubble ol {
            padding-left: 24px;
            margin: 8px 0;
        }

        .bubble li {
            margin: 4px 0;
            line-height: 1.75;
        }

        .bubble li::marker {
            color: var(--accent-3);
        }

        .bubble a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dashed rgba(99, 102, 241, 0.35);
            transition: all .15s;
            font-weight: 500;
        }

        .bubble a:hover {
            color: var(--accent-hover);
            border-bottom-style: solid;
            border-bottom-color: var(--accent);
        }

        /* 行内 code：柔和彩色胶囊 */
        .bubble code {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.10), rgba(139, 92, 246, 0.08));
            color: var(--accent-2);
            padding: 2px 7px;
            border-radius: 7px;
            font-size: 12.8px;
            font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Microsoft YaHei Mono", monospace;
            font-weight: 500;
            border: 1px solid rgba(99, 102, 241, 0.15);
        }

        [data-theme="dark"] .bubble code {
            background: linear-gradient(135deg, rgba(165, 180, 252, 0.20), rgba(139, 92, 246, 0.18));
            color: #c4b5fd;
            border-color: rgba(139, 92, 246, 0.3);
        }

        /* 代码块：深色主题 + 圆角 + 复制按钮 */
        .bubble pre {
            background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
            color: #e2e8f0;
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            margin: 14px 0;
            overflow-x: auto;
            font-size: 12.8px;
            line-height: 1.7;
            position: relative;
            font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Microsoft YaHei Mono", monospace;
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 0 8px 28px rgba(15, 23, 42, 0.32);
        }

        .bubble pre code {
            background: none;
            color: inherit;
            padding: 0;
            font-size: inherit;
            border: none;
            font-weight: 400;
        }

        .bubble pre .copy-code-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.18s;
            backdrop-filter: blur(8px);
        }

        .bubble pre:hover .copy-code-btn {
            opacity: 1;
        }

        .bubble pre .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            transform: translateY(-1px);
        }

        .bubble pre .copy-code-btn.copied {
            color: #34d399;
            background: rgba(16, 185, 129, 0.12);
        }

        .bubble pre .copy-code-btn svg {
            width: 15px;
            height: 15px;
        }

        /* 表格：现代斑马纹 */
        .bubble table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            margin: 14px 0;
            font-size: 13px;
            overflow: hidden;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-xs);
            border: 1px solid var(--border);
        }

        .bubble table th {
            background: linear-gradient(180deg, var(--surface-2), transparent);
            text-align: left;
            padding: 10px 14px;
            font-weight: 700;
            color: var(--text-soft);
            border-bottom: 1.5px solid var(--border-strong);
        }

        .bubble table td {
            padding: 9px 14px;
            border-bottom: 1px solid var(--border);
        }

        .bubble table tbody tr:nth-child(even) td {
            background: var(--surface-2);
        }

        .bubble table tbody tr:last-child td {
            border-bottom: none;
        }

        .bubble table tbody tr:hover td {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05), transparent);
        }

        blockquote {
            margin: 12px 0;
            padding: 10px 14px;
            border-left: 3.5px solid var(--accent);
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.06), transparent);
            border-radius: 0 10px 10px 0;
            color: var(--text-soft);
            font-style: italic;
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
            margin: 20px 0;
        }

        /* 来源 / 参考 */
        .sources-box {
            margin-top: 16px;
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            box-shadow: var(--shadow-xs);
        }

        .sources-header {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--accent);
            cursor: pointer;
            font-weight: 700;
            user-select: none;
            font-size: 12.5px;
            padding: 2px 4px;
            border-radius: 6px;
            transition: background .15s;
        }

        .sources-header:hover {
            background: rgba(99, 102, 241, 0.08);
        }

        .sources-header svg {
            margin-left: auto;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.85;
        }

        .sources-list[hidden] + * { /* noop */
        }

        .sources-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            color: var(--text-secondary);
        }

        .sources-list[hidden] {
            display: none;
        }

        .source-item {
            padding: 8px 10px;
            background: var(--surface-2);
            border-radius: 9px;
            line-height: 1.6;
            border: 1px solid var(--border);
            transition: all .15s;
        }

        .source-item:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateX(2px);
        }

        .source-item .source-score {
            display: inline-block;
            color: var(--success);
            font-size: 10.5px;
            font-weight: 700;
            margin-right: 7px;
            padding: 1.5px 6px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.1);
        }

        /* 加载指示器：三点小动画 */
        .typing-indicator {
            display: inline-flex;
            gap: 5px;
            padding: 8px 4px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.05), rgba(59, 130, 246, 0.03));
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, 0.15);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, var(--accent-3), var(--accent));
            border-radius: 50%;
            animation: typing 1.35s infinite ease-in-out;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* 流式光标 */
        .streaming-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--accent);
            margin-left: 2px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ================= ReAct 思考过程（最具辨识度的一块：时间轴） ================= */
        .react-box {
            margin-top: 16px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.06), rgba(59, 130, 246, 0.04));
            border: 1px solid rgba(139, 92, 246, 0.22);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-xs);
            position: relative;
        }

        /* 流式进度条 - 只在流式状态下显示 */
        .react-box.streaming::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--success));
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        .react-header, .compare-header {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(59, 130, 246, 0.10));
            font-weight: 700;
            font-size: 13px;
            color: #5b21b6;
            cursor: pointer;
            user-select: none;
            letter-spacing: 0.01em;
            position: relative;
            transition: background 0.2s;
        }

        .react-header:hover {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.16), rgba(59, 130, 246, 0.14));
        }

        [data-theme="dark"] .react-header,
        [data-theme="dark"] .compare-header {
            color: #c4b5fd;
        }

        .react-header svg, .sources-header svg {
            margin-left: auto;
            transition: transform .22s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.85;
        }

        .react-steps {
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            transition: opacity 0.25s ease-out;
        }

        .react-steps[hidden] {
            display: none;
            opacity: 0;
        }

        /* 垂直时间轴（Kimi 风格） */
        .react-steps::before {
            content: '';
            position: absolute;
            left: 25.5px;
            top: 24px;
            bottom: 20px;
            width: 2px;
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.4), rgba(59, 130, 246, 0.3), rgba(16, 185, 129, 0.25));
            border-radius: 1px;
        }

        /* 流式状态下的时间轴动画 */
        .react-steps.streaming::before {
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.6), rgba(59, 130, 246, 0.5), rgba(16, 185, 129, 0.4));
            animation: timelinePulse 2s infinite;
        }

        @keyframes timelinePulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .react-step {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-xs);
            overflow: hidden;
            position: relative;
            padding-left: 8px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .react-step:hover {
            box-shadow: var(--shadow-sm);
            transform: translateX(2px);
        }

        .react-step.step-thinking {
            border-left: 3px solid var(--accent-3);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.06), var(--shadow-xs);
            position: relative;
        }

        .react-step.step-thinking::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.03), transparent);
            animation: shimmer 2s infinite;
            background-size: 200% 100%;
            pointer-events: none;
        }

        .react-step.step-loading {
            border-left: 3px solid var(--warn);
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.05), transparent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.06), var(--shadow-xs);
        }

        .react-step-header {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.07), rgba(59, 130, 246, 0.06));
            border-bottom: 1px solid var(--border);
            font-size: 12.5px;
            gap: 9px;
        }

        .react-step-num {
            font-weight: 800;
            color: var(--accent-2);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.16), rgba(139, 92, 246, 0.12));
            padding: 3px 11px;
            border-radius: 999px;
            font-size: 11.5px;
            letter-spacing: 0.02em;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .react-meta {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 11.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .react-meta.thinking {
            color: var(--accent-2);
        }

        .react-meta.loading {
            color: var(--warn);
        }

        .react-step-body {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .react-thought, .react-action, .react-observation, .react-error {
            display: flex;
            gap: 12px;
            font-size: 13.5px;
            line-height: 1.8;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .react-thought > span, .react-action > span,
        .react-observation > span, .react-error > span {
            font-size: 17px;
            flex-shrink: 0;
            margin-top: 2px;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.1));
        }

        /* Thought：紫 */
        .react-thought {
            background: linear-gradient(135deg, rgba(245, 243, 255, 0.95), rgba(237, 233, 254, 0.9));
            border-color: rgba(139, 92, 246, 0.25);
            color: #4c1d95;
        }

        [data-theme="dark"] .react-thought {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(124, 58, 237, 0.12));
            color: #ddd6fe;
            border-color: rgba(139, 92, 246, 0.35);
        }

        /* Action：蓝 */
        .react-action {
            background: linear-gradient(135deg, rgba(239, 246, 255, 0.95), rgba(219, 234, 254, 0.9));
            border-color: rgba(59, 130, 246, 0.28);
            color: #1e3a8a;
        }

        [data-theme="dark"] .react-action {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(37, 99, 235, 0.1));
            color: #bfdbfe;
            border-color: rgba(59, 130, 246, 0.4);
        }

        .react-tool-name {
            font-weight: 750;
            font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
            color: inherit;
            letter-spacing: 0.01em;
            font-size: 13.5px;
        }

        .react-tool-args, .react-obs-body {
            margin-top: 10px;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            max-height: 200px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid rgba(148, 163, 184, 0.2);
            font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Microsoft YaHei Mono", monospace;
            line-height: 1.7;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* 自定义滚动条 */
        .react-tool-args::-webkit-scrollbar,
        .react-obs-body::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .react-tool-args::-webkit-scrollbar-track,
        .react-obs-body::-webkit-scrollbar-track {
            background: rgba(148, 163, 184, 0.1);
            border-radius: 3px;
        }

        .react-tool-args::-webkit-scrollbar-thumb,
        .react-obs-body::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 3px;
        }

        .react-tool-args::-webkit-scrollbar-thumb:hover,
        .react-obs-body::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }

        /* Observation：绿 */
        .react-observation {
            background: linear-gradient(135deg, rgba(236, 253, 245, 0.95), rgba(209, 250, 229, 0.88));
            border-color: rgba(16, 185, 129, 0.28);
            color: #064e3b;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .react-observation:hover {
            border-color: rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, rgba(236, 253, 245, 1), rgba(209, 250, 229, 0.95));
            transform: translateX(2px);
        }

        [data-theme="dark"] .react-observation {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(5, 150, 105, 0.1));
            color: #a7f3d0;
            border-color: rgba(16, 185, 129, 0.4);
        }

        .react-obs-title {
            font-size: 11.5px;
            color: var(--success);
            font-weight: 750;
            margin-bottom: 8px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .react-obs-title::after {
            content: '▼';
            font-size: 8px;
            transition: transform 0.2s;
        }

        .react-observation.collapsed .react-obs-title::after {
            transform: rotate(-90deg);
        }

        /* 已迁移至下方动画系统，移除旧的 display:none 规则 */

        /* Error：红 */
        .react-error {
            background: linear-gradient(135deg, rgba(254, 242, 242, 0.95), rgba(254, 226, 226, 0.9));
            border-color: rgba(239, 68, 68, 0.3);
            color: #7f1d1d;
        }

        [data-theme="dark"] .react-error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.18), rgba(185, 28, 28, 0.1));
            color: #fecaca;
            border-color: rgba(239, 68, 68, 0.45);
        }

        /* 工具调用 Loader - 优化版 */
        .react-tool-loading {
            margin-top: 8px;
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(251, 191, 36, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            font-size: 12.5px;
            color: #b45309;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            animation: fadeIn 0.3s ease-out;
        }

        [data-theme="dark"] .react-tool-loading {
            color: #fbbf24;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(251, 191, 36, 0.08));
            border-color: rgba(245, 158, 11, 0.4);
        }

        .loader-dots {
            display: inline-flex;
            gap: 4px;
        }

        .loader-dots b {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--warn);
            display: inline-block;
            animation: dotPulse 1.25s infinite ease-in-out both;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
        }

        .loader-dots b:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loader-dots b:nth-child(2) {
            animation-delay: -0.16s;
        }

        /* 思考中的加载点（紫色） */
        .thinking-dots b {
            background: var(--accent-3);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
        }

        @keyframes dotPulse {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        /* ================================================================
         *  ReAct 流式动画增强
         * ================================================================ */

        /* Step 入场动画：弹性滑入 + 淡入 */
        @keyframes stepSlideIn {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
                filter: blur(3px);
            }
            60% {
                opacity: 1;
                transform: translateY(-3px) scale(1.005);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .react-step {
            animation: stepSlideIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        /* 流式中的 step 不用入场动画（避免重复触发），用状态过渡替代 */
        .react-steps.streaming .react-step {
            animation: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 时间轴发光点：追踪当前 step 位置 */
        .react-steps::after {
            content: '';
            position: absolute;
            left: 22px;
            top: var(--dot-top, -20px);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-3);
            box-shadow:
                    0 0 12px rgba(139, 92, 246, 0.6),
                    0 0 24px rgba(139, 92, 246, 0.3),
                    0 0 0 4px rgba(139, 92, 246, 0.15);
            transform: translate(-4px, 0);
            opacity: 0;
            transition: top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
            opacity 0.3s ease;
            z-index: 2;
            pointer-events: none;
        }

        .react-steps.streaming::after {
            opacity: 1;
            animation: timelineDotPulse 1.8s ease-in-out infinite;
        }

        @keyframes timelineDotPulse {
            0%, 100% {
                box-shadow:
                        0 0 12px rgba(139, 92, 246, 0.6),
                        0 0 24px rgba(139, 92, 246, 0.3),
                        0 0 0 4px rgba(139, 92, 246, 0.15);
                transform: translate(-4px, 0) scale(1);
            }
            50% {
                box-shadow:
                        0 0 20px rgba(139, 92, 246, 0.8),
                        0 0 40px rgba(139, 92, 246, 0.4),
                        0 0 0 8px rgba(139, 92, 246, 0.1);
                transform: translate(-4px, 0) scale(1.2);
            }
        }

        /* Step 状态过渡：thinking → loading → done 的颜色渐变 */
        .react-step.step-thinking {
            border-left-color: var(--accent-3);
            transition: border-left-color 0.4s ease, box-shadow 0.4s ease;
        }

        .react-step.step-loading {
            border-left-color: var(--warn);
            transition: border-left-color 0.4s ease, box-shadow 0.4s ease;
        }

        .react-step.step-done {
            border-left-color: var(--success);
            border-left: 3px solid var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.08), var(--shadow-xs);
        }

        /* Step header 渐变背景加强 */
        .react-step-header {
            position: relative;
            overflow: hidden;
        }

        .react-step.step-thinking .react-step-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
            rgba(139, 92, 246, 0.08),
            rgba(139, 92, 246, 0.03),
            rgba(139, 92, 246, 0.08));
            background-size: 300% 100%;
            animation: headerShimmer 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        .react-step.step-loading .react-step-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
            rgba(245, 158, 11, 0.08),
            rgba(245, 158, 11, 0.03),
            rgba(245, 158, 11, 0.08));
            background-size: 300% 100%;
            animation: headerShimmer 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes headerShimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* 流式进度条增强：多层光效 */
        .react-box.streaming::before {
            background: linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(139, 92, 246, 0.4) 15%,
                    rgba(99, 102, 241, 0.8) 30%,
                    rgba(59, 130, 246, 0.9) 50%,
                    rgba(99, 102, 241, 0.8) 70%,
                    rgba(139, 92, 246, 0.4) 85%,
                    transparent 100%
            );
            background-size: 200% 100%;
            animation: progressFlow 1.5s linear infinite;
            height: 3px;
            filter: blur(0.5px);
        }

        @keyframes progressFlow {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* 流式中 react-box 整体微妙发光 */
        .react-box.streaming {
            box-shadow:
                    var(--shadow-xs),
                    0 0 0 1px rgba(139, 92, 246, 0.12),
                    0 4px 20px rgba(139, 92, 246, 0.08);
            transition: box-shadow 0.5s ease;
        }

        /* Thought 文字流式：渐显效果 */
        .react-thought .stream-text {
            display: inline;
        }

        /* 工具调用完成：checkmark 弹入 */
        @keyframes checkBounce {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-45deg);
            }
            60% {
                transform: scale(1.2) rotate(0deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .react-action .tool-done {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--success);
            color: #fff;
            font-size: 11px;
            margin-left: 8px;
            animation: checkBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
        }

        /* Observation 展开/折叠动画 */
        .react-observation .react-obs-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
            padding 0.25s ease,
            opacity 0.25s ease;
            opacity: 0;
            padding: 0 14px;
        }

        .react-observation:not(.collapsed) .react-obs-body {
            max-height: 500px;
            opacity: 1;
            padding: 12px 14px;
        }

        /* 时间轴线流光增强 */
        .react-steps.streaming::before {
            background: linear-gradient(
                    180deg,
                    rgba(139, 92, 246, 0.7) 0%,
                    rgba(99, 102, 241, 0.5) 30%,
                    rgba(59, 130, 246, 0.4) 60%,
                    rgba(16, 185, 129, 0.3) 100%
            );
            animation: timelineGlow 2s ease-in-out infinite alternate;
        }

        @keyframes timelineGlow {
            0% {
                filter: brightness(0.8);
                width: 2px;
            }
            100% {
                filter: brightness(1.3);
                width: 3px;
            }
        }

        /* ================= 两两对比 ================= */
        .compare-box {
            margin-top: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .compare-header {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.10), rgba(16, 185, 129, 0.08));
            color: var(--text-primary);
            cursor: default;
        }

        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border-top: 1px solid var(--border);
        }

        .compare-col {
            min-width: 0;
        }

        .compare-col + .compare-col {
            border-left: 1px solid var(--border);
        }

        .compare-col-header {
            padding: 11px 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }

        .compare-col-header.agent-bg {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.14), transparent);
        }

        .compare-col-header.react-bg {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.14), transparent);
        }

        .compare-col-header b {
            font-size: 14.5px;
            font-weight: 750;
        }

        .compare-col-header span {
            color: var(--text-muted);
            font-size: 11.5px;
            font-weight: 500;
        }

        .compare-col-body {
            padding: 16px 16px 12px;
            font-size: 13.2px;
            line-height: 1.8;
            max-height: 72vh;
            overflow: auto;
        }

        @media (max-width: 768px) {
            .compare-grid {
                grid-template-columns: 1fr;
            }

            .compare-col + .compare-col {
                border-left: none;
                border-top: 1px solid var(--border);
            }
        }

        /* ================= 元数据统计栏 ================= */
        .stats-bar {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            padding: 8px 12px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--surface-2), transparent);
            border: 1px solid var(--border);
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .stats-bar > * {
            opacity: 0.95;
        }

        /* ================= 光标 ================= */
        .cursor {
            display: inline-block;
            width: 2.5px;
            height: 1.08em;
            background: linear-gradient(180deg, var(--accent), var(--accent-3));
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.95s steps(2, start) infinite;
            border-radius: 1.5px;
            box-shadow: 0 0 6px rgba(99, 102, 241, 0.5);
        }

        @keyframes blink {
            to {
                visibility: hidden;
                opacity: 0;
            }
        }

        /* ================= 输入区（最关键交互区） ================= */
        .input-wrapper {
            padding: 14px 24px 22px;
            border-top: 1px solid var(--border);
            background: linear-gradient(180deg, transparent, var(--main-bg) 20%),
            var(--main-bg);
            position: relative;
            z-index: 20;
            animation: fadeInUp 0.5s ease-out 0.3s backwards;
        }

        .input-inner {
            max-width: 880px;
            margin: 0 auto;
            position: relative;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 10px 10px 10px 14px;
            background: var(--surface);
            border: 1.5px solid var(--border-strong);
            border-radius: 26px;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .input-box::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 28px;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.55), rgba(139, 92, 246, 0.35), rgba(16, 185, 129, 0.3));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity .25s;
            pointer-events: none;
        }

        .input-box::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 26px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.03), transparent);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .input-box.focus {
            border-color: transparent;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.10),
            0 0 0 4px rgba(99, 102, 241, 0.12);
            transform: translateY(-1px);
        }

        .input-box.focus::before {
            opacity: 1;
        }

        .input-box.focus::after {
            opacity: 1;
        }

        .input-box:hover:not(.focus) {
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: var(--shadow-md);
        }


        /* ---------- 模式切换器：Segmented Control（ChatGPT 风格） ---------- */

        /* ================= 输入区按钮 ================= */
        .tool-icon-btn {
            width: 38px;
            height: 38px;
            border: none;
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
            flex-shrink: 0;
        }

        .tool-icon-btn:hover {
            background: var(--sidebar-item-hover);
            color: var(--accent);
            transform: scale(1.05);
        }

        .tool-icon-btn:active {
            transform: scale(0.95);
        }

        .tool-icon-btn svg {
            width: 18px;
            height: 18px;
        }

        .tool-icon-btn.stop {
            color: var(--danger);
        }

        .tool-icon-btn.stop:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 14px;
            cursor: pointer;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }

        .send-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .send-btn:hover::before {
            opacity: 1;
        }

        .send-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .send-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            position: relative;
            z-index: 1;
            transition: transform 0.2s;
        }

        .send-btn:hover svg {
            transform: translateX(1px);
        }

        #input {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-size: 14.5px;
