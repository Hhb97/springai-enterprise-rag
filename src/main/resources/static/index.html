<script>
    // ============== State ==============
    const STORAGE_KEY = 'rag_chats_v1';
    const THEME_KEY = 'rag_theme_v1';
    const COLLAPSE_KEY = 'rag_sidebar_v1';
    let chats = loadChats();
    let currentChatId = chats[0]?.id || null;
    let currentMode = 'agent';
    let isGenerating = false;
    let abortController = null;
    let typeTimer = null;

    // ============== DOM ==============
    const $ = id => document.getElementById(id);
    const chatContentEl = $('chatContent');
    const chatContainerEl = $('chatContainer');
    const inputEl = $('input');
    const sendBtn = $('sendBtn');
    const stopBtn = $('stopBtn');
    const inputBox = $('inputBox');
    const topbarTitle = $('topbarTitle');

    // ============== Init ==============
    initTheme();
    initSidebarState();
    if (chats.length === 0) newChat(true);
    else renderChatList();
    renderChat();

    // ============== Events ==============
    inputEl.addEventListener('input', autosizeTextarea);
    inputEl.addEventListener('focus', () => inputBox.classList.add('focus'));
    inputEl.addEventListener('blur', () => inputBox.classList.remove('focus'));
    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            send();
        }
    });

    // ============== Theme ==============
    function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved) document.body.dataset.theme = saved;
        updateThemeIcon();
    }

    function toggleTheme() {
        const cur = document.body.dataset.theme;
        const next = cur === 'dark' ? 'light' : 'dark';
        document.body.dataset.theme = next;
        localStorage.setItem(THEME_KEY, next);
        updateThemeIcon();
    }

    function updateThemeIcon() {
        const dark = document.body.dataset.theme === 'dark';
        $('themeIcon').innerHTML = dark
            ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
            : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    }

    // ============== Sidebar ==============
    function initSidebarState() {
        const collapsed = localStorage.getItem(COLLAPSE_KEY) === '1';
        if (collapsed) $('sidebar').classList.add('collapsed');
    }

    function toggleSidebar() {
        const el = $('sidebar');
        el.classList.toggle('collapsed');
        localStorage.setItem(COLLAPSE_KEY, el.classList.contains('collapsed') ? '1' : '0');
    }

    function loadChats() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
            return [];
        }
    }

    function saveChats() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    }

    function newChat(silent = false) {
        const id = 'c_' + Date.now();
        chats.unshift({
            id, title: '新对话',
            createdAt: Date.now(),
            updatedAt: Date.now(),
            messages: []
        });
        currentChatId = id;
        saveChats();
        renderChatList();
        renderChat();
        if (!silent) {
            inputEl.focus();
            toast('已新建对话', 'success');
        }
    }

    function switchChat(id) {
        if (isGenerating) return;
        currentChatId = id;
        const chat = getCurrentChat();
        if (chat) {
            const mode = chat.mode
                || (chat.messages && [...chat.messages].reverse().find(m => m.mode)?.mode)
                || 'agent';
            if (mode !== currentMode) setMode(mode);
        }
        renderChatList();
        renderChat();
    }

    function deleteChat(e, id) {
        e.stopPropagation();
        if (!confirm('确定删除这个对话吗？')) return;
        chats = chats.filter(c => c.id !== id);
        if (currentChatId === id) {
            currentChatId = chats[0]?.id || null;
            if (!currentChatId) newChat(true);
        }
        saveChats();
        renderChatList();
        renderChat();
    }

    function clearCurrentChat() {
        const chat = getCurrentChat();
        if (!chat || chat.messages.length === 0) return;
        if (isGenerating) return;
        if (!confirm('清空当前对话的所有消息？')) return;
        chat.messages = [];
        chat.title = '新对话';
        chat.updatedAt = Date.now();
        saveChats();
        renderChatList();
        renderChat();
    }

    function clearAllChats() {
        if (chats.length === 0) return;
        if (!confirm('确定清空所有历史对话吗？此操作不可恢复')) return;
        chats = [];
        saveChats();
        newChat(true);
        toast('历史对话已清空', 'success');
    }

    function getCurrentChat() {
        return chats.find(c => c.id === currentChatId);
    }

    function setMode(mode) {
        if (isGenerating) return;
        currentMode = mode;
        $('modeAgent').classList.toggle('active', mode === 'agent');
        $('modeReAct').classList.toggle('active', mode === 'react');
        $('modeCompare').classList.toggle('active', mode === 'compare');
        $('modePlan').classList.toggle('active', mode === 'plan');
        $('modeRag').classList.toggle('active', mode === 'rag');
        const subtitleMap = {
            agent: 'Spring AI 2.0 · Agent 工具模式（黑盒）',
            react: 'ReAct 推理模式 · 手写循环 · 每步可见',
            compare: '两两对比模式 · Agent vs ReAct',
            plan: 'Plan-then-Execute · 先规划再并行执行 · 每步可见',
            rag: 'Spring AI 2.0 · RAG 知识库模式'
        };
        const subEl = document.querySelector('.sidebar-subtitle');
        if (subEl) subEl.textContent = subtitleMap[mode] || subtitleMap.agent;
        if (inputEl) inputEl.placeholder = mode === 'compare'
            ? '对比模式：输入问题后，Agent 与 ReAct 将同时回答...'
            : mode === 'plan'
                ? '规划模式：先由 Planner 生成计划，再并行执行工具，最后统一综合回答...'
                : '有什么可以帮你的？输入问题或指令...';
        // 空对话时刷新欢迎页，让标题/引导卡片跟随当前模式（否则切模式后页面展示还是旧的）
        const curChat = getCurrentChat();
        if (curChat && (!curChat.messages || curChat.messages.length === 0)) {
            renderChat();
        }
    }

    // ============== Render ==============
    function renderChatList() {
        const list = $('chatList');
        list.innerHTML = chats.map(c => {
            const time = formatRelTime(c.updatedAt);
            const active = c.id === currentChatId ? 'active' : '';
            return `<div class="chat-item ${active}" onclick="switchChat('${c.id}')">
        <div class="chat-item-title">${escapeHtml(c.title || '新对话')}</div>
        <div class="chat-item-time">${time}</div>
        <button class="chat-item-delete" onclick="deleteChat(event, '${c.id}')" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>`;
        }).join('');
    }

    function renderChat() {
        const chat = getCurrentChat();
        if (!chat) {
            newChat(true);
            return;
        }
        topbarTitle.textContent = chat.title || '新对话';

        if (!chat.messages || chat.messages.length === 0) {
            const modeConfig = {
                agent: {
                    logo: '🤖',
                    title: '你好，我是智能运维助手（Agent）',
                    subtitle: 'Spring AI 2.0 · 原生 Tool Calling · 黑盒循环'
                },
                react: {
                    logo: '🧠',
                    title: '你好，我是 ReAct 推理助手',
                    subtitle: '手写 Thought → Action → Observation 循环 · 每步可见'
                },
                compare: {
                    logo: '⚖️',
                    title: '两两对比验证：Agent vs ReAct',
                    subtitle: '同一个问题 · 两种模式 · 同时回答 · 直观对比效果'
                },
                plan: {
                    logo: '📋',
                    title: '你好，我是规划式 Agent（Plan-then-Execute）',
                    subtitle: 'Planner 先规划 → Executor 并行执行工具 → Solver 统一综合 · 每步可见'
                },
                rag: {logo: '📚', title: '你好，我是知识库助手', subtitle: '纯 RAG 检索 · 基于文档回答'}
            }[currentMode] || {
                logo: '🤖',
                title: '你好，我是智能运维助手',
                subtitle: '支持知识库问答 · Agent 工具调用 · 设备查询与能耗分析'
            };

            chatContentEl.innerHTML = `
        <div class="welcome">
          <div class="welcome-logo">${modeConfig.logo}</div>
          <h1 class="welcome-title">${modeConfig.title}</h1>
          <p class="welcome-subtitle">${modeConfig.subtitle}</p>

          <div class="suggest-grid">
            <div class="suggest-card" onclick="fillAndSend('列出所有设备')">
              <div class="suggest-card-icon">📋</div>
              <div class="suggest-card-title">查询设备清单</div>
              <div class="suggest-card-desc">获取当前纳管的所有设备及状态概览</div>
            </div>
            <div class="suggest-card" onclick="fillAndSend('test-devices 详细信息，包含位置、型号、状态')">
              <div class="suggest-card-icon">ℹ️</div>
              <div class="suggest-card-title">设备详情查询</div>
              <div class="suggest-card-desc">查看指定设备的型号、位置、运行状态等</div>
            </div>
            <div class="suggest-card" onclick="fillAndSend('test-devices 近30天能耗趋势分析')">
              <div class="suggest-card-icon">📊</div>
              <div class="suggest-card-title">能耗趋势分析</div>
              <div class="suggest-card-desc">分析近期能耗数据，输出趋势与异常点</div>
            </div>
            <div class="suggest-card" onclick="fillAndSend('电压谐波失真和电流谐波失真的限值标准分别是多少？')">
              <div class="suggest-card-icon">📚</div>
              <div class="suggest-card-title">知识库问答</div>
              <div class="suggest-card-desc">查询手册、告警规则、标准规范等文档</div>
            </div>
          </div>

          <div class="quick-chips">
            <span class="quick-chip" onclick="fillAndSend('Alert和Alarm Event有什么区别？')">Alert vs Alarm 区别</span>
            <span class="quick-chip" onclick="fillAndSend('设备出现过压告警应该怎么处理？')">过压告警处理步骤</span>
            <span class="quick-chip" onclick="fillAndSend('test-devices 近半年能耗情况')">半年能耗对比</span>
          </div>
        </div>
      `;
            return;
        }

        chatContentEl.innerHTML = `<div class="messages-wrapper">
      ${chat.messages.map((m, idx) => renderMessage(m, idx)).join('')}
    </div>`;

        // Bind code copy
        chatContentEl.querySelectorAll('pre code').forEach(block => {
            const pre = block.parentElement;
            if (!pre.querySelector('.copy-code-btn')) {
                const btn = document.createElement('button');
                btn.className = 'copy-code-btn';
                btn.title = '复制代码';
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
                btn.onclick = () => {
                    navigator.clipboard.writeText(block.innerText);
                    btn.classList.add('copied');
                    setTimeout(() => btn.classList.remove('copied'), 1500);
                };
                pre.appendChild(btn);
            }
        });

        scrollToBottom();
    }

    function renderMessage(m, idx) {
        const isUser = m.role === 'user';
        const clazz = isUser ? 'user' : 'bot';
        const avatar = isUser
            ? '<div class="avatar user">我</div>'
            : '<div class="avatar bot">🤖</div>';

        let content;
        if (isUser) {
            content = escapeHtml(m.content).replace(/\n/g, '<br>');
        } else if (m.compare) {
            content = renderCompare(m.compare);
        } else {
            let mdSrc = m.content || '';
            let stepsSrc = m.steps || [];
            if (m.streaming) {
                mdSrc = m.streamContent || '';
                stepsSrc = (m.streamSteps || []).filter(Boolean);
            }
            // 流式未结束时给最终 answer 加个光标
            if (m.streaming && mdSrc && !m.content) {
                mdSrc += '\u200B';
                content = renderMarkdown(mdSrc) + '<span class="streaming-cursor"></span>';
            } else {
                content = renderMarkdown(mdSrc);
            }
            if (stepsSrc && stepsSrc.length) content += renderReActSteps(stepsSrc, m.streaming, m.mode);
            if (!m.streaming && m.sources && m.sources.length) content += renderSources(m.sources);
            const meta = {
                stepCount: m.stepCount,
                totalMs: m.totalMs,
                queryRewritten: m.queryRewritten,
                mode: m.mode,
                streaming: m.streaming
            };
            content += renderStatsBar(meta);
        }

        const tools = isUser ? `
      <div class="message-tools">
        <button class="tool-btn" onclick="copyMsg(${idx})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制
        </button>
      </div>
    ` : `
      <div class="message-tools">
        <button class="tool-btn" onclick="copyMsg(${idx})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制
        </button>
        <button class="tool-btn" onclick="regenerate(${idx})" ${isGenerating ? 'style="pointer-events:none;opacity:0.4"' : ''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          重新生成
        </button>
      </div>
    `;

        return `<div class="message-row ${clazz}">
      ${isUser ? '' : avatar}
      <div class="message-body">
        <div class="bubble" data-idx="${idx}">${content}</div>
        ${tools}
      </div>
      ${isUser ? avatar : ''}
    </div>`;
    }

    function renderSources(sources) {
        const items = sources.map((s, i) => {
            const score = s.score ? `<span class="source-score">${(s.score * 100).toFixed(0)}%</span>` : '';
            const text = s.content.length > 220 ? s.content.slice(0, 220) + '…' : s.content;
            return `<div class="source-item">${score}[${i + 1}] ${escapeHtml(text)}</div>`;
        }).join('');
        return `<div class="sources-box">
      <div class="sources-header" onclick="this.nextElementSibling.hidden = !this.nextElementSibling.hidden">
        📎 参考来源 (${sources.length})
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="sources-list" hidden>${items}</div>
    </div>`;

    function renderReActSteps(steps, streaming, mode) {
        if (!steps || !steps.length) return '';
        const isPlan = mode === 'plan';
        const boxTitle = isPlan ? '📋 执行步骤（Plan-then-Execute）' : '🧠 ReAct 推理步骤';
        const lastActiveIdx = streaming ? steps.reduce((acc, s, i) => (s.thoughtStreaming || s.actionLoading) ? i : acc, -1) : -1;
        const stepsHtml = steps.map((s, idx) => {
            const hasRealDuration = s.durationMs != null && s.durationMs > 0;
            const isDone = hasRealDuration && !s.actionLoading && !s.thoughtStreaming;
            const duration = hasRealDuration ? `<span class="react-meta">⏱️ ${s.durationMs}ms</span>`
                : s.actionLoading ? `<span class="react-meta loading"><span class="loader-dots"><b></b><b></b><b></b></span> 调用工具中…</span>`
                    : s.thoughtStreaming ? `<span class="react-meta thinking"><span class="loader-dots thinking-dots"><b></b><b></b><b></b></span> 思考中…</span>` : '';
            const thoughtHtml = (s.thought || s.thoughtStreaming)
                ? `<div class="react-thought"><span>💭</span><div>${escapeHtml(s.thought || '')}${s.thoughtStreaming ? '<span class="streaming-cursor"></span>' : ''}</div></div>`
                : '';
            let toolHtml = '';
            if (s.tool) {
                const argsHtml = s.arguments != null && Object.keys(s.arguments).length
                    ? `<pre class="react-tool-args">${escapeHtml(JSON.stringify(s.arguments, null, 2))}</pre>` : '';
                const loadingHtml = s.actionLoading
                    ? `<div class="react-tool-loading"><span class="loader-dots"><b></b><b></b><b></b></span> 正在调用 <b>${escapeHtml(s.tool)}</b>…</div>`
                    : (isDone ? '<span class="tool-done">✓</span>' : '');
                toolHtml = `
                    <div class="react-action">
                        <span>🔧</span>
                <div>
                    <div class="react-tool-name">${escapeHtml(s.tool)}${loadingHtml.includes('tool-done') ? loadingHtml : ''}</div>
                    ${argsHtml}
                    ${loadingHtml.includes('react-tool-loading') ? loadingHtml : ''}
                </div>
            </div>`;
            }
            const obs = s.observation != null ? `
                <div class="react-observation collapsed" onclick="this.classList.toggle('collapsed')">
                    <span>👁️</span>
                <div>
                    <div class="react-obs-title">观察结果（点击展开/折叠）</div>
                    <pre class="react-obs-body">${escapeHtml(typeof s.observation === 'string' ? s.observation : JSON.stringify(s.observation, null, 2))}</pre>
                </div>
            </div>` : '';
            const err = s.error ? `<div class="react-error"><span>❌</span><div>${escapeHtml(s.error)}</div></div>` : '';
            const stateClass = s.actionLoading ? 'step-loading' : (s.thoughtStreaming ? 'step-thinking' : (isDone ? 'step-done' : ''));
            return `
                <div class="react-step ${stateClass}" data-step="${s.step}">
                    <div class="react-step-header">
                    <div class="react-step-num">Step ${s.step}</div>
                ${duration}
            </div>
                <div class="react-step-body">
                    ${thoughtHtml}${toolHtml}${obs}${err}
                </div>
            </div>`;
        }).join('');
        const defaultOpen = !!streaming;
        // 计算时间轴发光点位置：最后一个活跃 step 的位置
        const dotTop = lastActiveIdx >= 0 ? `${32 + lastActiveIdx * 86}px` : '-20px';
        return `
                <div class="react-box ${streaming ? 'streaming' : ''}">
                    <div class="react-header" onclick="this.nextElementSibling.hidden = !this.nextElementSibling.hidden">
          ${boxTitle} (<span class="step-count">${steps.length}</span>)
                ${streaming ? '<span style="font-size:11px;color:#8b5cf6;margin-left:8px;">（实时更新）</span>' : ''}
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
                <div class="react-steps ${streaming ? 'streaming' : ''}" style="--dot-top:${dotTop}" ${defaultOpen ? '' : 'hidden'}>${stepsHtml}</div>
            </div>`;
    }

    function renderCompare(compareData) {
        if (!compareData) return '';
        const a = compareData.agent || {};
        const r = compareData.react || {};
        const badge = (ok) => ok
            ? '<span style="color:#10b981">✓ 成功</span>'
            : '<span style="color:#ef4444">✗ 失败</span>';
        const aSources = renderSources(a.sources || []);
        const rSteps = renderReActSteps(r.steps || []);

            </div>
                <div class="compare-grid">
                    <div class="compare-col">
                        <div class="compare-col-header agent-bg">
                            <div><b>⚡ Agent</b> <span style="font-size:11px">Spring AI 原生 · 黑盒</span></div>
                            <div style="font-size:12px">${badge(a.success)} · ⏱️ ${a.elapsedMs || 0}ms</div>
                        </div>
                        <div class="compare-col-body">
                            ${(a.answer || '').replace(/\n/g, '<br>')}
                            ${aSources}

                    <div class="compare-col">
                        <div class="compare-col-header react-bg">
                            <div><b>🧠 ReAct</b> <span style="font-size:11px">手写循环 · 每步可见</span></div>
                            <div style="font-size:12px">${badge(r.success)} · ⏱️ ${r.elapsedMs || 0}ms · 🪜 ${r.stepCount || 0} 步</div>

                        <div class="compare-col-body">

                            ${rSteps}

    function renderStatsBar(meta) {
        if (!meta) return '';
        const parts = [];
        if (meta.stepCount != null) parts.push(`🪜 ${meta.stepCount} 步推理`);
        if (meta.totalMs) parts.push(`⏱️ ${meta.totalMs}ms`);
        if (meta.queryRewritten) parts.push('🔄 查询已改写');
        if (meta.mode === 'react') parts.push('🧠 ReAct');
        if (meta.mode === 'plan') parts.push('📋 Plan-Execute');
        if (!parts.length) return '';
        return `<div class="stats-bar">${parts.join(' · ')}</div>`;
    }

    // ============== Message actions ==============
    function copyMsg(idx) {
        const chat = getCurrentChat();
        const m = chat?.messages[idx];
        if (!m) return;
        navigator.clipboard.writeText(m.content);
        const btn = event.currentTarget;
        btn.classList.add('copied');
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 已复制';
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 复制';
        }, 1500);
    }

    function regenerate(idx) {
        if (isGenerating) return;
        const chat = getCurrentChat();
        if (!chat || idx <= 0) return;
        // Find user message just before idx (could be idx-1 or earlier)
        const userMsgIdx = chat.messages.slice(0, idx + 1).findLastIndex(m => m.role === 'user');
        if (userMsgIdx < 0) return;
        const userMsg = chat.messages[userMsgIdx].content;
        // Truncate messages from the user message onward
        chat.messages = chat.messages.slice(0, userMsgIdx);
        saveChats();
        renderChat();
        sendWithText(userMsg);
    }

    // ============== Send flow ==============
    function fillAndSend(text) {
        if (isGenerating) return;
        inputEl.value = text;
        autosizeTextarea();
        send();
    }

    async function send() {
        if (isGenerating) return;
        const text = inputEl.value.trim();
        if (!text) return;
        await sendWithText(text);
    }

    async function sendWithText(text) {
        const chat = getCurrentChat();
        if (!chat) newChat(true);

        // Update chat title if empty/new
        if (!chat.messages.length) {
            chat.title = text.length > 26 ? text.slice(0, 26) + '…' : text;
        }
        chat.messages.push({role: 'user', content: text});
        chat.mode = currentMode;
        chat.updatedAt = Date.now();
        inputEl.value = '';
        autosizeTextarea();
        saveChats();
        renderChatList();
        renderChat();

        isGenerating = true;
        setGeneratingUI(true);
        abortController = new AbortController();

        // Append loading bubble
        const botIdx = chat.messages.length;
        chat.messages.push({role: 'bot', content: '', sources: []});
        renderChat();
        const lastBubble = chatContentEl.querySelector(`[data-idx="${botIdx}"]`);
        if (lastBubble) {
            lastBubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
        }

        try {
            const payload = {
                question: text,
                enableHybridSearch: $('hybridSearch').checked,
                topK: parseInt($('topK').value),
                sessionId: chat.id
            };

            if (currentMode === 'react' || currentMode === 'plan') {
                // ===== ReAct / Plan 模式：走 SSE 流式（Plan 复用同一套事件渲染）=====
                chat.messages[botIdx] = {
                    role: 'bot',
                    content: '',
                    sources: [],
                    streamSteps: [],
                    streamContent: '',
                    streaming: true,
                    mode: currentMode
                };
                // 重置增量 patch 追踪状态
                _prevStepCount = 0;
                _prevThoughtLen = {};
                saveChats();
                renderChat();

                const endpoint = currentMode === 'react' ? '/ai/react-agent-chat-stream' : '/ai/plan-chat-stream';
                const res = await authFetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Accept': 'text/event-stream'},
                    body: JSON.stringify(payload),
                    signal: abortController.signal
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const reader = res.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let currentEvent = 'message';
                let currentDataLines = [];
                let finalDoneReceived = false;

                while (isGenerating) {
                    const {value, done} = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, {stream: true});

                    // 按行解析 SSE：event: xxx \n data: xxx \n\n 结束一个事件
                    const lines = buffer.split(/\r?\n/);
                    buffer = lines.pop() || ''; // 最后一截不完整的留下

                    for (const line of lines) {
                        if (line.trim() === '') {
                            // 事件结束
                            if (currentDataLines.length) {
                                const dataStr = currentDataLines.join('\n');
                                try {
                                    const d = JSON.parse(dataStr);
                                    try {
                                        handleSseEvent(botIdx, currentEvent, d);
                                    } catch (handleErr) {
                                        console.error('[handleSseEvent] 运行时错误 event=' + currentEvent, handleErr, d);
                                    }
                                    if (currentEvent === 'done') finalDoneReceived = true;
                                } catch (parseErr) {
                                    // 非 JSON 的 data 忽略
                                }
                            }
                            currentEvent = 'message';
                            currentDataLines = [];
                            continue;
                        }
                        if (line.startsWith(':')) continue; // SSE 注释跳过
                        const colon = line.indexOf(':');
                        if (colon < 0) continue;
                        const field = line.slice(0, colon);
                        const val = line.slice(colon + 1).replace(/^ /, '');
                        if (field === 'event') currentEvent = val;
                        else if (field === 'data') currentDataLines.push(val);
                    }
                    if (finalDoneReceived) break;
                }
                // 流结束，把 streaming 关掉，把最终数据落到正式字段
                const curChat = getCurrentChat();
                const curMsg = curChat && curChat.messages ? curChat.messages[botIdx] : null;
                if (curMsg) {
                    curMsg.streaming = false;
                    if (!curMsg.content && curMsg.streamContent) curMsg.content = curMsg.streamContent;
                    // done 事件里的 steps 优先（handleSseEvent 在 done 里已经赋值了 msg.steps），
                    // 只有 done 丢了（极端情况）才从流式过程积累的 streamSteps 兜底拷贝
                    if (!curMsg.steps && curMsg.streamSteps) {
                        curMsg.steps = curMsg.streamSteps.filter(Boolean).map(s => ({...s}));
                    }
                    curMsg.streamSteps = undefined;
                    curMsg.streamContent = undefined;
                    if (curChat) curChat.updatedAt = Date.now();
                    saveChats();
                    renderChat();
                    scrollToBottom();
                }

            } else {
                // ===== 其他模式：普通 fetch + JSON =====
                const endpointMap = {
                    agent: '/ai/agent-chat',
                    compare: '/ai/compare-chat',
                    plan: '/ai/plan-chat',
                    rag: '/ai/chat'
                };
                const endpoint = endpointMap[currentMode] || '/ai/chat';

                const res = await authFetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload),
                    signal: abortController.signal
                });
                const data = await res.json();

                if (!isGenerating) return;

                const botMsg = {role: 'bot'};
                let displayAnswer;

                if (currentMode === 'compare' && res.ok && (data.agent || data.react)) {
                    botMsg.compare = data;
                    displayAnswer = '⚖️ 对比完成（见上方对比视图）';
                } else {
                    const answer = (res.ok && data.answer) ? data.answer : ('❌ ' + (data.detail || data.message || '请求失败'));
                    displayAnswer = answer;
                    botMsg.content = answer;
                    botMsg.sources = (res.ok && data.sources) ? data.sources : [];
                    if (res.ok && data.steps) botMsg.steps = data.steps;
                    if (res.ok && data.stepCount != null) botMsg.stepCount = data.stepCount;
                    if (res.ok && data.totalMs) botMsg.totalMs = data.totalMs;
                    if (res.ok && data.queryRewritten) botMsg.queryRewritten = data.queryRewritten;
                    if (res.ok && data.mode) botMsg.mode = data.mode;
                }

                chat.messages[botIdx] = botMsg;
                chat.updatedAt = Date.now();
                saveChats();
                renderChat();

                if (!botMsg.compare) {
                    const bubble = chatContentEl.querySelector(`[data-idx="${botIdx}"]`);
                    if (bubble && displayAnswer && !displayAnswer.startsWith('❌')) {
                        await typewriterEffect(bubble, displayAnswer, botMsg.sources);
                    } else {
                        scrollToBottom();
                    }
                } else {
                    scrollToBottom();
                }
            }
        } catch (err) {
            if (err.name === 'AbortError') {
                chat.messages[botIdx].content = (chat.messages[botIdx].content || '') + '\n\n_（已停止生成）_';
            } else {
                chat.messages[botIdx].content = '❌ 网络错误: ' + err.message;
            }
            chat.updatedAt = Date.now();
            saveChats();
            renderChat();
        } finally {
            isGenerating = false;
            setGeneratingUI(false);
            abortController = null;
        }
    }

    // ===== 流式渲染节流 + 增量 patch 状态 =====
    let _streamThrottleTimer = null;
    let _streamDirty = false;
    const STREAM_THROTTLE_MS = 60; // 60ms，更流畅的流式体验
    let _prevStepCount = 0; // 跟踪上一次 patch 时的 step 数量
    let _prevThoughtLen = {}; // 跟踪每个 step 的 thought 长度，用于增量追加

    /**
     * 增量 patch：只更新变化的部分，而非全量替换 innerHTML
     * - 新 step：插入 DOM 并播放入场动画
     * - thought 增量：追加文字而非替换
     * - 状态变化：更新 class 而非重建
     * - 流结束：一次性全量渲染固化
     */
    function patchStreamBubble(botIdx) {
        const chat = getCurrentChat();
        if (!chat || !chat.messages || !chat.messages[botIdx]) return;
        const msg = chat.messages[botIdx];
        const bubble = chatContentEl.querySelector(`.bubble[data-idx="${botIdx}"]`);
        if (!bubble) {
            try { renderChat(); } catch (_) {}
            return;
        }

        const stepsSrc = (msg.streamSteps || []).filter(Boolean);
        const streaming = msg.streaming;

        // ===== 增量策略：检查是否可以做局部更新 =====
        const reactBox = bubble.querySelector('.react-box');
        const canIncremental = reactBox && streaming && stepsSrc.length > 0;

        if (canIncremental) {
            try {
                incrementalPatchSteps(bubble, reactBox, stepsSrc, msg, streaming);
                return;
            } catch (e) {
                // 增量失败，降级到全量 patch
                console.warn('[incrementalPatch] fallback to full patch', e);
            }
        }

        // ===== 降级：全量 patch（保留展开状态） =====
        const expandedObs = new Set();
        try {
            bubble.querySelectorAll('.react-observation').forEach((el, i) => {
                if (!el.classList.contains('collapsed')) expandedObs.add(i);
            });
        } catch (_) {}

        const html = renderMessageInner(msg, botIdx);
        if (html) {
            requestAnimationFrame(() => {
                chatContainerEl.classList.add('stream-updating');
                bubble.innerHTML = html;
                try {
                    bubble.querySelectorAll('.react-observation').forEach((el, i) => {
                        if (expandedObs.has(i)) el.classList.remove('collapsed');
                    });
                } catch (_) {}
                requestAnimationFrame(() => {
                    chatContainerEl.classList.remove('stream-updating');
                });
            });
        }
    }

    /**
     * 增量 patch：只更新变化的 DOM 节点
     */
    function incrementalPatchSteps(bubble, reactBox, stepsSrc, msg, streaming) {
        const stepsContainer = reactBox.querySelector('.react-steps');
        if (!stepsContainer) return;

        // 确保 streaming class 正确
        reactBox.classList.toggle('streaming', streaming);
        stepsContainer.classList.toggle('streaming', streaming);

        // 更新 header 计数
        const header = reactBox.querySelector('.react-header');
        if (header) {
            const countSpan = header.querySelector('.step-count');
            if (countSpan) countSpan.textContent = stepsSrc.length;
        }

        // 同步 step 卡片数量
        const existingSteps = stepsContainer.querySelectorAll('.react-step');
        const currentCount = existingSteps.length;

        // 1. 新增 step 卡片
        for (let i = currentCount; i < stepsSrc.length; i++) {
            const s = stepsSrc[i];
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = buildStepHtml(s);
            const stepEl = tempDiv.firstElementChild;
            if (stepEl) {
                stepEl.style.animationDelay = '0s';
                stepsContainer.appendChild(stepEl);
            }
        }

        // 2. 更新已有 step 的状态和内容
        const allSteps = stepsContainer.querySelectorAll('.react-step');
        for (let i = 0; i < stepsSrc.length && i < allSteps.length; i++) {
            const s = stepsSrc[i];
            const stepEl = allSteps[i];
            const hasRealDuration = s.durationMs != null && s.durationMs > 0;
            const isDone = hasRealDuration && !s.actionLoading && !s.thoughtStreaming;

            // 更新状态 class
            stepEl.classList.toggle('step-thinking', !!s.thoughtStreaming);
            stepEl.classList.toggle('step-loading', !!s.actionLoading);
            stepEl.classList.toggle('step-done', isDone);

            // 增量更新 thought 文字（追加而非替换）
            const thoughtDiv = stepEl.querySelector('.react-thought > div:last-child');
            if (thoughtDiv && (s.thought || s.thoughtStreaming)) {
                const key = 'step_' + s.step;
                const prevLen = _prevThoughtLen[key] || 0;
                const newThought = s.thought || '';
                if (newThought.length > prevLen) {
                    // 增量追加新文字
                    const newPart = newThought.slice(prevLen);
                    const cursor = thoughtDiv.querySelector('.streaming-cursor');
                    if (cursor) cursor.remove();
                    thoughtDiv.insertAdjacentText('beforeend', newPart);
                    if (s.thoughtStreaming) {
                        const cursorSpan = document.createElement('span');
                        cursorSpan.className = 'streaming-cursor';
                        thoughtDiv.appendChild(cursorSpan);
                    }
                    _prevThoughtLen[key] = newThought.length;
                } else if (!s.thoughtStreaming && thoughtDiv.querySelector('.streaming-cursor')) {
                    // thought 结束，移除光标
                    thoughtDiv.querySelector('.streaming-cursor').remove();
                }
            }

            // 更新 meta 信息（思考中/调用中/耗时）
            const metaEl = stepEl.querySelector('.react-meta, .react-meta.loading, .react-meta.thinking');
            if (metaEl) {
                let newMeta = '';
                if (hasRealDuration) {
                    newMeta = `<span class="react-meta">⏱️ ${s.durationMs}ms</span>`;
            } else if (s.actionLoading) {
                newMeta = '<span class="react-meta loading"><span class="loader-dots"><b></b><b></b><b></b></span> 调用工具中…</span>';
            } else if (s.thoughtStreaming) {
                newMeta = '<span class="react-meta thinking"><span class="loader-dots thinking-dots"><b></b><b></b><b></b></span> 思考中…</span>';
            }
            if (newMeta) {
                const tempSpan = document.createElement('span');
                tempSpan.innerHTML = newMeta;
                metaEl.replaceWith(tempSpan.firstElementChild || tempSpan);
            }
        }

        // 更新 action 区域（工具调用完成时添加 checkmark）
        if (isDone && s.tool) {
            const toolNameEl = stepEl.querySelector('.react-tool-name');
            if (toolNameEl && !toolNameEl.querySelector('.tool-done')) {
                const check = document.createElement('span');
                check.className = 'tool-done';
                check.textContent = '✓';
                toolNameEl.appendChild(check);
            }
            // 移除 loading 指示器
            const loadingEl = stepEl.querySelector('.react-tool-loading');
            if (loadingEl) loadingEl.remove();
        }

        // 新增 observation
        if (s.observation != null && !stepEl.querySelector('.react-observation')) {
            const obsHtml = `
            <div class="react-observation collapsed" onclick="this.classList.toggle('collapsed')">
              <span>👁️</span>
              <div>
                <div class="react-obs-title">观察结果（点击展开/折叠）</div>
                <pre class="react-obs-body">${escapeHtml(typeof s.observation === 'string' ? s.observation : JSON.stringify(s.observation, null, 2))}</pre>
              </div>
            </div>`;
            const body = stepEl.querySelector('.react-step-body');
            if (body) body.insertAdjacentHTML('beforeend', obsHtml);
        }

        // 新增 error
        if (s.error && !stepEl.querySelector('.react-error')) {
            const errHtml = `<div class="react-error"><span>❌</span><div>${escapeHtml(s.error)}</div></div>`;
            const body = stepEl.querySelector('.react-step-body');
            if (body) body.insertAdjacentHTML('beforeend', errHtml);
        }
    }

    // 3. 更新时间轴发光点位置
    const lastActiveIdx = stepsSrc.reduce((acc, s, i) => (s.thoughtStreaming || s.actionLoading) ? i : acc, -1);
    if (lastActiveIdx >= 0) {
        stepsContainer.style.setProperty('--dot-top', `${32 + lastActiveIdx * 86}px`);
    }

    // 4. 更新最终回答内容（final_delta）
    if (msg.streamContent) {
        const answerEl = bubble.querySelector('.react-answer, .markdown-body');
        if (answerEl) {
            answerEl.innerHTML = renderMarkdown(msg.streamContent + '\u200B') + '<span class="streaming-cursor"></span>';
        }
    }

    _prevStepCount = stepsSrc.length;
    }

    /**
     * 构建单个 step 的完整 HTML（用于增量插入）
     */
    function buildStepHtml(s) {
        const hasRealDuration = s.durationMs != null && s.durationMs > 0;
        const isDone = hasRealDuration && !s.actionLoading && !s.thoughtStreaming;
        const duration = hasRealDuration ? `<span class="react-meta">⏱️ ${s.durationMs}ms</span>`
            : s.actionLoading ? '<span class="react-meta loading"><span class="loader-dots"><b></b><b></b><b></b></span> 调用工具中…</span>'
                : s.thoughtStreaming ? '<span class="react-meta thinking"><span class="loader-dots thinking-dots"><b></b><b></b><b></b></span> 思考中…</span>' : '';
        const thoughtHtml = (s.thought || s.thoughtStreaming)
            ? `<div class="react-thought"><span>💭</span><div>${escapeHtml(s.thought || '')}${s.thoughtStreaming ? '<span class="streaming-cursor"></span>' : ''}</div></div>`
            : '';
        let toolHtml = '';
        if (s.tool) {
            const argsHtml = s.arguments != null && Object.keys(s.arguments).length
                ? `<pre class="react-tool-args">${escapeHtml(JSON.stringify(s.arguments, null, 2))}</pre>` : '';
            const doneCheck = isDone ? '<span class="tool-done">✓</span>' : '';
            const loadingHtml = s.actionLoading
                ? '<div class="react-tool-loading"><span class="loader-dots"><b></b><b></b><b></b></span> 正在调用 <b>' + escapeHtml(s.tool) + '</b>…</div>'
                : '';
            toolHtml = `
          <div class="react-action">
            <span>🔧</span>
            <div>
              <div class="react-tool-name">${escapeHtml(s.tool)}${doneCheck}</div>
              ${argsHtml}
              ${loadingHtml}
            </div>
          </div>`;
        }
        const obs = s.observation != null ? `
        <div class="react-observation collapsed" onclick="this.classList.toggle('collapsed')">
          <span>👁️</span>
          <div>
            <div class="react-obs-title">观察结果（点击展开/折叠）</div>
            <pre class="react-obs-body">${escapeHtml(typeof s.observation === 'string' ? s.observation : JSON.stringify(s.observation, null, 2))}</pre>
          </div>
        </div>` : '';
        const err = s.error ? `<div class="react-error"><span>❌</span><div>${escapeHtml(s.error)}</div></div>` : '';
        const stateClass = s.actionLoading ? 'step-loading' : (s.thoughtStreaming ? 'step-thinking' : (isDone ? 'step-done' : ''));
        return `
        <div class="react-step ${stateClass}" data-step="${s.step}">
          <div class="react-step-header">
            <div class="react-step-num">Step ${s.step}</div>
            ${duration}
          </div>
          <div class="react-step-body">
            ${thoughtHtml}${toolHtml}${obs}${err}
          </div>
        </div>`;
    }

    function scheduleStreamPatch(botIdx) {
        _streamDirty = true;
        if (_streamThrottleTimer) return;
        _streamThrottleTimer = setTimeout(() => {
            _streamThrottleTimer = null;
            if (!_streamDirty) return;
            _streamDirty = false;
            patchStreamBubble(botIdx);
            // 智能滚动：接近底部时自动跟随，否则保持用户当前位置
            try {
                const nearBottom =
                    chatContainerEl.scrollHeight - chatContainerEl.scrollTop - chatContainerEl.clientHeight < 260;
                if (nearBottom) {
                    requestAnimationFrame(() => {
                        chatContainerEl.classList.add('stream-updating');
                        chatContainerEl.scrollTo({
                            top: chatContainerEl.scrollHeight,
                            behavior: 'instant'
                        });
                        requestAnimationFrame(() => {
                            chatContainerEl.classList.remove('stream-updating');
                        });
                    });
                }
            } catch (_) {}
        }, STREAM_THROTTLE_MS);
    }

    /**
     * 只渲染 bot 消息 bubble 的「内容部分」（不含 avatar 外框），返回 HTML 字符串。
     * 完全复用 renderMessage / renderReActSteps / renderStatsBar 等现有函数，避免逻辑重复。
     */
    function renderMessageInner(m, idx) {
        if (!m || m.role !== 'bot') return '';
        let mdSrc = m.content || '';
        let stepsSrc = m.steps || [];
        if (m.streaming) {
            mdSrc = m.streamContent || '';
            stepsSrc = (m.streamSteps || []).filter(Boolean);
        }
        let content;
        if (m.compare) {
            content = renderCompare(m.compare);
        } else {
            if (m.streaming && mdSrc && !m.content) {
                content = renderMarkdown(mdSrc + '\u200B') + '<span class="streaming-cursor"></span>';
            } else {
                content = renderMarkdown(mdSrc);
            }
            if (stepsSrc && stepsSrc.length) content += renderReActSteps(stepsSrc, m.streaming, m.mode);
            if (!m.streaming && m.sources && m.sources.length) content += renderSources(m.sources);
            const meta = {
                stepCount: m.stepCount,
                totalMs: m.totalMs,
                queryRewritten: m.queryRewritten,
                mode: m.mode,
                streaming: m.streaming
            };
            content += renderStatsBar(meta);
        }
        return content;
    }

    function handleSseEvent(botIdx, event, d) {
        // ===== 关键修复：每次进来重新拿 chat + bot msg（不再依赖 sendWithText 局部变量 chat） =====
        const chat = getCurrentChat();
        if (!chat || !chat.messages || !chat.messages[botIdx]) {
            console.warn('[handleSseEvent] chat/botMsg 不存在', {botIdx, event});
            return;
        }
        const msg = chat.messages[botIdx];
        // ===== 防御性初始化流式中间态字段 =====
        if (!msg.streamSteps) msg.streamSteps = [];
        if (typeof msg.streamContent !== 'string') msg.streamContent = '';

        const ensureStep = (stepNum) => {
            const i = stepNum - 1;
            if (!msg.streamSteps[i]) {
                msg.streamSteps[i] = {
                    step: stepNum,
                    thought: '',
                    thoughtStreaming: true,
                    tool: null,
                    arguments: null,
                    observation: null,
                    actionLoading: false,
                    durationMs: 0
                };
            }
            return msg.streamSteps[i];
        };

        // ===== 更新数据 & 按事件频率决定渲染策略（避免高频 token 下的全量重排闪屏） =====
        let renderMode = 'patch'; // 默认：局部 patch（节流）
        // patch：节流 80ms 局部刷新当前气泡（99% 的事件走这条路）
        // full： 全量 renderChat（仅新卡片插入、流结束这种重大节点）

        switch (event) {
            case 'step_start':
                ensureStep(d.step);
                renderMode = 'patch'; // 改为 patch，避免全量渲染导致的闪屏
                break;

            case 'thought_delta':
                if (d.delta) {
                    const s = ensureStep(d.step);
                    s.thoughtStreaming = true;
                    if (!s._hadJsonMark) {
                        if (/^\s*("|\{)/.test(d.delta) || /"tool"\s*:/.test(s.thought + d.delta)) {
                            s._hadJsonMark = true;
                        } else {
                            s.thought += d.delta;
                        }
                    }
                }
                break; // thought_delta 高频：仅 patch（节流）

            case 'thought_end': {
                const s = ensureStep(d.step);
                if (typeof d.thought === 'string' && d.thought) s.thought = d.thought;
                s.thoughtStreaming = false;
                s._hadJsonMark = false;
                if (d.tool) {
                    s.tool = d.tool;
                    s.arguments = d.arguments || null;
                    s.actionLoading = true;
                }
                break; // patch
            }

            case 'action_start': {
                const s = ensureStep(d.step);
                if (d.tool) s.tool = d.tool;
                if (d.arguments != null) s.arguments = d.arguments;
                s.actionLoading = true;
                s.thoughtStreaming = false;
                break;
            }

            case 'action_end': {
                const s = ensureStep(d.step);
                if (d.observation != null) s.observation = d.observation;
                s.durationMs = d.durationMs || s.durationMs || 0;
                s.actionLoading = false;
                if (d.tool && !s.tool) s.tool = d.tool;
                break;
            }

            case 'rewrite':
                msg.queryRewritten = true;
                msg.rewrittenQuery = d.to;
                break;

            case 'rag_ready':
                msg._ragCount = d.count;
                break;

            case 'final_start':
                break;

            case 'final_delta':
                if (d.delta) msg.streamContent += d.delta;
                break; // final_delta 极高频：只 patch

            case 'error':
                msg._streamError = (msg._streamError || '') + (d.message || '错误');
                break;

            case 'done':
                msg.sources = d.sources || msg.sources || [];
                if (d.totalMs) msg.totalMs = d.totalMs;
                if (d.stepCount != null) msg.stepCount = d.stepCount;
                if (d.queryRewritten != null) msg.queryRewritten = d.queryRewritten;
                if (d.rewrittenQuery != null) msg.rewrittenQuery = d.rewrittenQuery;
                msg.mode = d.mode || 'react';
                if (d.steps && d.steps.length) msg.steps = d.steps;
                if (d.answer != null && d.answer !== '') {
                    msg.content = d.answer;
                    msg.streamContent = d.answer;
                } else if (!msg.content && msg.streamContent) {
                    msg.content = msg.streamContent;
                }
                renderMode = 'full'; // 流结束：全量重渲染一次固化（含 sources / 统计栏）
                break;
        }

        chat.updatedAt = Date.now();

        // ===== 核心渲染分流：节流局部 patch vs 低频全量重绘 =====
        try {
            if (renderMode === 'full') {
                // 重大节点：先 flush 掉节流中待处理的 dirty，再整页 renderChat（只发生 2~5 次/请求）
                if (_streamThrottleTimer) {
                    clearTimeout(_streamThrottleTimer);
                    _streamThrottleTimer = null;
                    _streamDirty = false;
                    // 先把当前数据刷到 DOM（省得节流里旧数据覆盖新的）
                    patchStreamBubble(botIdx);
                }
                // 临时禁用平滑滚动
                chatContainerEl.classList.add('stream-updating');
                renderChat();
                const nearBottom =
                    chatContainerEl.scrollHeight - chatContainerEl.scrollTop - chatContainerEl.clientHeight < 300;
                if (nearBottom) {
                    chatContainerEl.scrollTop = chatContainerEl.scrollHeight;
                }
                // 恢复平滑滚动
                requestAnimationFrame(() => {
                    chatContainerEl.classList.remove('stream-updating');
                });
            } else {
                // 高频 token：只 schedule 节流 patch（不会触发整个聊天容器重建，绝对不闪）
                scheduleStreamPatch(botIdx);
            }
        } catch (renderErr) {
            console.error('[handleSseEvent] 渲染出错', renderErr);
        }
    }

    function stopGeneration() {
        if (!isGenerating) return;
        if (abortController) abortController.abort();
        isGenerating = false;
        if (typeTimer) {
            clearTimeout(typeTimer);
            typeTimer = null;
        }
        // 如果是 ReAct 流式半途中止，把现有内容固化下来
        const chat = getCurrentChat();
        if (chat && chat.messages.length) {
            const last = chat.messages[chat.messages.length - 1];
            if (last && last.role === 'bot' && last.streaming) {
                last.streaming = false;
                if (!last.content && last.streamContent) last.content = last.streamContent + '\n\n_（已停止生成）_';
                if (!last.steps && last.streamSteps) last.steps = last.streamSteps;
                last.streamSteps = undefined;
                last.streamContent = undefined;
            }
        }
        setGeneratingUI(false);
        saveChats();
        renderChat();
        toast('已停止生成');
    }

    function setGeneratingUI(loading) {
        sendBtn.disabled = loading;
        stopBtn.style.display = loading ? 'flex' : 'none';
        $('statusDot').style.background = loading ? '#f59e0b' : '#10b981';
        const labelMap = {
            agent: 'Agent 推理中...',
            react: 'ReAct 推理中（Thought → Action → Observation）...',
            compare: '双模式对比中（Agent + ReAct 同时推理）...',
            plan: '规划执行中（Planner → Executor → Solver）...',
            rag: '知识库检索中...'
        };
        $('statusText').textContent = loading ? (labelMap[currentMode] || '思考中...') : '就绪';
        inputEl.readOnly = loading;
        inputEl.style.opacity = loading ? '0.6' : '1';
    }

    // ============== Typewriter ==============
    function typewriterEffect(el, fullContent, sources) {
        return new Promise(resolve => {
            const markdownCache = {full: renderMarkdown(fullContent) + (sources?.length ? renderSources(sources) : '')};
            // For now, just render all then do a visual typewriter on text (lightweight)
            el.innerHTML = '';
            let i = 0;
            const STEP = Math.max(2, Math.floor(fullContent.length / 60));
            const tick = () => {
                i = Math.min(fullContent.length, i + STEP);
                const partial = fullContent.slice(0, i);
                el.innerHTML = renderMarkdown(partial) + (i < fullContent.length ? '<span class="cursor"></span>' : '') + (sources?.length && i >= fullContent.length ? renderSources(sources) : '');
                scrollToBottom();
                if (i < fullContent.length) {
                    typeTimer = setTimeout(tick, 12);
                } else {
                    // Render full for correct markdown closure
                    el.innerHTML = markdownCache.full;
                    scrollToBottom();
                    resolve();
                }
            };
            tick();
        });
    }

    // ============== Markdown ==============
    function renderMarkdown(text) {
        if (!text) return '';
        let html = text;

        // Preserve code blocks first
        const codeBlocks = [];
        html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (m, lang, code) => {
            codeBlocks.push({lang: lang || '', code: code.replace(/^\n|\n$/g, '')});
            return `\u0000CODE${codeBlocks.length - 1}\u0000`;
        });

        // Tables
        html = html.split('\n').map(line => {
            // placeholder for table detection - parse separately below
            return line;
        }).join('\n');

        html = parseMarkdownTables(html);

        // Headings (must be before inline)
        html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>');
        html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
        html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
        html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

        // Blockquotes
        html = html.replace(/^> (.+)$/gm, '<blockquote style="border-left:3px solid var(--accent);padding:4px 12px;margin:8px 0;color:var(--text-secondary);background:rgba(99,102,241,0.04);border-radius:0 6px 6px 0;">$1</blockquote>');

        // Inline formatting
        html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');
        html = html.replace(/`([^`]+?)`/g, (m, c) => {
            if (/CODE\d+/.test(c)) return m;
            return `<code>${c}</code>`;
        });

        // Lists (ordered + unordered)
        html = html.replace(/^(\s*)[-*] (.+)$/gm, (m, sp, c) => `<li style="margin-left:${sp.length * 4}px;list-style:disc;">${c}</li>`);
        html = html.replace(/^(\s*)(\d+)\. (.+)$/gm, (m, sp, n, c) => `<li style="margin-left:${sp.length * 4}px;list-style:decimal;">${c}</li>`);
        html = wrapAdjacentTags('li', html, 'ul');

        // Paragraphs for standalone lines (don't wrap block elements)
        const lines = html.split('\n');
        html = lines.map(line => {
            const t = line.trim();
            if (!t) return '';
            if (/^<(h[1-6]|ul|ol|li|blockquote|pre|table|div|p|h\d)/i.test(t)) return line;
            return `<p>${line}</p>`;
        }).join('\n');
        html = html.replace(/<\/p>\s*<p>/g, '</p><p>');
        html = html.replace(/(<p>)+/g, '<p>').replace(/(<\/p>)+/g, '</p>');

        // Restore code blocks
        html = html.replace(/\u0000CODE(\d+)\u0000/g, (m, idx) => {
            const cb = codeBlocks[parseInt(idx)];
            const escaped = escapeHtml(cb.code);
            return `<pre><code class="lang-${cb.lang}">${escaped}</code></pre>`;
        });

        // Cleanup
        html = html.replace(/\n{3,}/g, '\n\n');
        return html;
    }

    function wrapAdjacentTags(tag, html, wrapperTag) {
        const regex = new RegExp(`(<${tag}[^>]*>[\\s\\S]*?</${tag}>)(\\s*(?=<${tag}[^>]*>))?`, 'g');
        const parts = [];
        let inWrap = false;
        const pieces = html.split(/(<\/li>)/);
        let out = '';
        let open = false;
        for (let i = 0; i < pieces.length; i++) {
            const p = pieces[i];
            if (!p) continue;
            if (p.startsWith('<li')) {
                if (!open) {
                    out += `<${wrapperTag} style="margin:6px 0;">`;
                    open = true;
                }
            }
            out += p;
            if (p === '</li>') {
                const next = pieces[i + 1];
                if (!next || !next.trim().startsWith('<li')) {
                    out += `</${wrapperTag}>`;
                    open = false;
                }
            }
        }
        return out || html;
    }

    function parseMarkdownTables(text) {
        const lines = text.split('\n');
        const result = [];
        let i = 0;
        while (i < lines.length) {
            const line = lines[i].trim();
            if (line.includes('|') && i + 1 < lines.length) {
                const sep = lines[i + 1].trim();
                if (sep.match(/^[\s|:\-]+$/) && sep.includes('-') && sep.includes('|')) {
                    const header = line.split('|').map(c => c.trim()).filter(c => c !== '');
                    const rows = [];
                    let j = i + 2;
                    while (j < lines.length) {
                        const rl = lines[j].trim();
                        if (rl.includes('|')) {
                            const cells = rl.split('|').map(c => c.trim()).filter((c, idx) => !(idx === 0 && c === '') && !(idx === rl.split('|').length - 1 && c === ''));
                            if (cells.length === header.length || cells.length >= 1 && rl.startsWith('|')) {
                                while (cells.length < header.length) cells.push('');
                                rows.push(cells.slice(0, header.length));
                                j++;
                            } else break;
                        } else break;
                    }
                    // Build table
                    let tbl = '<table><thead><tr>';
                    header.forEach(h => tbl += `<th>${escapeHtml(h)}</th>`);
                    tbl += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        tbl += '<tr>';
                        r.forEach((c, k) => {
                            const align = /^[\d.]+$/.test(c) && k > 0 ? ' style="text-align:right;"' : '';
                            tbl += `<td${align}>${escapeHtml(c)}</td>`;
                        });
                        tbl += '</tr>';
                    });
                    tbl += '</tbody></table>';
                    result.push(tbl);
                    i = j;
                    continue;
                }
            }
            result.push(lines[i]);
            i++;
        }
        return result.join('\n');
    }

    // ============== Utils ==============
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
    }

    function autosizeTextarea() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
    }

    function scrollToBottom() {
        requestAnimationFrame(() => {
            // 临时禁用平滑滚动
            chatContainerEl.classList.add('stream-updating');
            chatContainerEl.scrollTop = chatContainerEl.scrollHeight;
            // 恢复平滑滚动
            requestAnimationFrame(() => {
                chatContainerEl.classList.remove('stream-updating');
            });
        });
    }

    function formatRelTime(ts) {
        const diff = Date.now() - ts;
        const min = Math.floor(diff / 60000);
        if (min < 1) return '刚刚';
        if (min < 60) return min + '分钟前';
        const h = Math.floor(min / 60);
        if (h < 24) return h + '小时前';
        const d = Math.floor(h / 24);
        if (d < 7) return d + '天前';
        const dt = new Date(ts);
        return `${dt.getMonth() + 1}/${dt.getDate()}`;
    }

    let toastTimer = null;

    function toast(msg, type = '') {
        const el = $('toast');
        el.textContent = msg;
        el.className = 'toast show ' + type;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            el.className = 'toast ' + type;
        }, 2000);
    }
</script>

            </div>
            <div style="margin-bottom:24px;">
                <label style="display:block; font-size:14px; font-weight:600; color:#374151; margin-bottom:8px;">密码</label>
                <input type="password" id="loginPassword" required
                       style="width:100%; padding:14px 16px; border:2px solid #e5e7eb; border-radius:10px; font-size:15px; outline:none; transition:border-color 0.2s;"
                       placeholder="请输入密码">
            </div>
            <div id="loginError" style="display:none; background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:12px; border-radius:8px; margin-bottom:16px; font-size:14px;"></div>
            <button type="submit"
                    style="width:100%; padding:14px; background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; transition:transform 0.2s, box-shadow 0.2s;">
                登录
            </button>
        </form>
        <p style="text-align:center; margin-top:20px; font-size:12px; color:#9ca3af;">
            默认凭证: admin / admin123
        </p>
    </div>
</div>

<script>
    // ========== 认证状态管理 ==========
    let authToken = localStorage.getItem('authToken') || null;
    let currentUsername = localStorage.getItem('username') || null;

    // 更新用户信息显示
    function refreshUserDisplay() {
        const userArea = document.getElementById('userArea');
        const userAvatar = document.getElementById('userAvatar');
        const userNameText = document.getElementById('userNameText');
        if (!userArea) return;

        if (currentUsername) {
            userArea.style.display = 'flex';
            userAvatar.textContent = currentUsername.charAt(0).toUpperCase();
            userNameText.textContent = currentUsername;
        } else {
            userArea.style.display = 'none';
        }
    }

    // 检查是否已登录
    async function checkAuthStatus() {
        try {
            const resp = await fetch('/api/auth/status');
            if (resp.ok) {
                const data = await resp.json();
                if (!data.enabled) {
                    currentUsername = null;
                    refreshUserDisplay();
                    return true;
                }
                if (data.authenticated) {
                    currentUsername = data.username;
                    localStorage.setItem('username', currentUsername || '');
                    refreshUserDisplay();
                    return true;
                }
                if (authToken) {
                    refreshUserDisplay();
                    return true;
                }
                refreshUserDisplay();
                showLoginModal();
                return false;
            }
        } catch (e) {
            console.error('检查认证状态失败:', e);
        }
        if (!authToken) {
            refreshUserDisplay();
            showLoginModal();
            return false;
        }
        refreshUserDisplay();
        return true;
    }

    function showLoginModal() {
        document.getElementById('loginModal').style.display = 'flex';
        refreshUserDisplay();
    }
    function hideLoginModal() {
        document.getElementById('loginModal').style.display = 'none';
        refreshUserDisplay();
    }

    async function doLogout() {
        if (!confirm('确定退出登录吗？')) return;
        try {
            await authFetch('/api/auth/logout', { method: 'POST' });
        } catch (e) {}
        authToken = null;
        currentUsername = null;
        localStorage.removeItem('authToken');
        localStorage.removeItem('username');
        refreshUserDisplay();
        showLoginModal();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const errorEl = document.getElementById('loginError');
        errorEl.style.display = 'none';
        try {
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                credentials: 'include',
                body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password)
            });
            const data = await resp.json();
            if (data.success) {
                authToken = data.token;
                currentUsername = data.username;
                localStorage.setItem('authToken', authToken);
                localStorage.setItem('username', currentUsername);
                hideLoginModal();
            } else {
                errorEl.textContent = data.message || '登录失败';
                errorEl.style.display = 'block';
            }
        } catch (e) {
            errorEl.textContent = '网络错误，请重试';
            errorEl.style.display = 'block';
        }
    });

    async function authFetch(url, options = {}) {
        const headers = options.headers || {};
        if (authToken) {
            headers['Authorization'] = 'Basic ' + authToken;
        }
        const resp = await fetch(url, {
            ...options,
            headers,
            credentials: 'include'
        });
        if (resp.status === 401) {
            authToken = null;
            currentUsername = null;
            localStorage.removeItem('authToken');
            localStorage.removeItem('username');
            refreshUserDisplay();
            showLoginModal();
            throw new Error('Unauthorized');
        }
        return resp;
    }

    // 初始化用户显示
    refreshUserDisplay();

    // 启动时检查认证
    (async function initAuth() {
        const authenticated = await checkAuthStatus();
        if (!authenticated) {
            // 未登录，阻止后续操作
            console.log('🔐 等待用户登录...');
        }
    })();
</script>
</body>
</html>
